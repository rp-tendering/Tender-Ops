      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(d.port)}</b><span class="status ${d.status === "open" ? "open" : "resolved"}">${d.status === "open" ? "Today" : "Closed"}</span></div>
      <span class="d">${fmtDate(d.date)} · last tender ${esc(d.lastTender || "—")}</span>
      <div class="g"><div><span>Trips</span><i>${s.tripsOut != null ? s.tripsOut + s.tripsBack : "—"}</i></div><div><span>Pax ashore</span><i>${s.paxOut != null ? num(s.paxOut) : "—"}</i></div><div><span>Round trip</span><i>${s.cycleAvg != null ? s.cycleAvg + "′" : "—"}</i></div></div></button>`; }).join("")}</div>`
      : `<p style="color:var(--muted);margin:0">Closed tender days appear here.</p>`}</section>`;
}
function loginHTML(){
  return `<div class="wrap login"><form id="loginForm" autocomplete="on">
    <div style="display:flex;gap:10px;align-items:center">${boatSVG(false).replace('class="boat ', 'style="width:80px" class="boat ')}<h1>Tendering<br>Operations</h1></div>
    <div class="fld"><span>Access</span><select id="lgRole"><option value="deck">Deck</option><option value="hotel">Hotel</option><option value="tech">Tech</option></select></div>
    <div class="fld"><span>Password</span><input id="lgPw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
    <span class="lgfoot">${esc(CONFIG.shipName)} · tendering operations<br><i class="credit">made by Erio</i></span></form></div>`;
}
function bindLogin(){
  const f = $("#loginForm"); if (!f) return;
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); $("#lgErr").textContent = "";
    try { await S.store.signIn($("#lgRole").value, $("#lgPw").value); }
    catch(e){ const c = e.code || ""; $("#lgErr").textContent = c.includes("too-many") ? "Too many attempts from this network. Wait a while, or try from another connection." : /password|credential|user/i.test(c + e.message) ? "Wrong password for this access." : (e.message || "Sign-in failed"); }
  });
}

/* ---------------- theme, toast, wake lock ---------------- */
const SUN = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>`;
const MOON = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>`;
function isDark(){ return lsGet("tb.theme") === "dark"; }
function themeLabel(){ const t = lsGet("tb.theme") || "auto"; return t === "auto" ? "Auto" : t === "dark" ? "Dark" : "Light"; }
function applyTheme(){ document.documentElement.setAttribute("data-theme", isDark() ? "dark" : "light"); }
let toastTimer = null, toastUndo = null;
function toast(msg, undoId){
  const t = $("#toast"); toastUndo = undoId || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undoId ? `<button type="button" id="toastUndo">Undo</button>` : ""}`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; toastUndo = null; }, undoId ? 7000 : 3200);
  const b = $("#toastUndo"); if (b) b.addEventListener("click", () => { if (toastUndo && day()){ S.store.deleteEvent(day().id, toastUndo); t.hidden = true; toastUndo = null; toast("Undone"); } });
}
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch(e){} }
document.addEventListener("visibilitychange", keepAwake);

/* ---------------- modal ---------------- */
let sheetUnit = null;
function modal({title, body, submit="Save", danger=false, onSubmit, extra="", onOpen}){
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-close="1"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <header><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close="1" aria-label="Close">✕</button></header>
    <div class="mb">${body}</div>
    <footer>${extra}<button type="button" class="btn" data-close="1">${submit ? "Cancel" : "Close"}</button>${submit ? `<button type="submit" class="btn ${danger ? "arm" : "primary"}">${esc(submit)}</button>` : ""}</footer></form></div>`;
  const form = root.querySelector("form");
  root.querySelector(".overlay").addEventListener("click", e => { if (e.target.dataset.close) closeModal(); });
  root.querySelectorAll("button[data-close]").forEach(b => b.addEventListener("click", closeModal));
  form.addEventListener("submit", e => { e.preventDefault(); const r = onSubmit && onSubmit(form); if (r !== false) closeModal(); });
  if (onOpen) onOpen(form);
  const first = form.querySelector("input.big, input:not([type=hidden]):not([type=checkbox]), textarea"); if (first && !form.dataset.nofocus) setTimeout(() => first.focus(), 30);
}
function closeModal(){ $("#modal-root").innerHTML = ""; sheetUnit = null; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const normHM = v => { const d = String(v || "").replace(/\D/g, ""); if (d.length < 3 || d.length > 4) return null; const h = +d.slice(0, d.length - 2), m = +d.slice(-2); return h < 24 && m < 60 ? pad(h) + ":" + pad(m) : null; };
const hmInput = (id, val, extra="") => `<input id="${id}" class="hm mono" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off" value="${esc(val)}" ${extra}>`;
const timeField = (id, ms, label="Time (24h)") => `<label class="fld"><span>${label}</span>${hmInput(id, fmtT(ms ?? Date.now()), `data-init="${fmtT(ms ?? Date.now())}"`)}</label>`;
document.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("hm")){ const n = normHM(e.target.value); if (n) e.target.value = n; } });
function readTime(form, id, dayDate, fallback){
  const el = form.querySelector("#" + id); if (!el) return fallback ?? Date.now();
  const v = normHM(el.value);
  if (!v || v === el.dataset.init) return fallback ?? Date.now();
  return hmToMs(dayDate || ymd(Date.now()), v) ?? Date.now();
}
const driverList = () => `<datalist id="drvList">${(ST ? ST.drivers : []).map(d => `<option value="${esc(d)}">`).join("")}</datalist>`;
function berthChoice(st, current, id="mBerth"){
  const fb = freeBerths(st), def = current || fb[0] || "SB";
  const btn = (b, sub) => { const dis = b !== "SB" && !fb.includes(b) && current !== b; return `<button type="button" data-berth="${b}" aria-pressed="${def === b}" ${dis ? "disabled" : ""}>${b === "SB" ? "Stand-by" : berthShort(b) + "<small>pontoon</small>"}<small>${sub}</small></button>`; };
  const sub = b => !st.pont[b] ? "closed" : st.occ[b] && current !== b ? "occupied · " + st.occ[b].full : "free";
  return `<div class="fld"><span>Ship berth · ${st.pont.side}</span><div class="choice" id="${id}" data-val="${def}">${btn("FWD", sub("FWD"))}${btn("MID", sub("MID"))}${btn("SB", "wait off ship")}</div></div>`;
}
function bindChoice(f, id="mBerth"){ const box = f.querySelector("#" + id); if (!box) return; box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { box.dataset.val = b.dataset.berth; box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); })); }

const day = () => S.data.currentDay;
function addEv(type, unit, extra, t, msg){

function sheetModal(u){

      ${isIss.length ? `<div class="fld"><span>Open issues</span>${isIss.map(i => `<div class="warnbox"><b>${esc(i.category)}</b> · ${esc(i.text)}</div>`).join("")}</div>` : ""}
      ${isAdmin() && u.active ? `<div class="menu-list">
        ${u.loc === "ship" && u.berth === "SB" ? `<button type="button" class="btn" data-m="depart-shore">Depart → Shore from stand-by</button>` : ""}
        ${(u.loc === "transit" && u.dir === "ship") || (u.loc === "ship" && u.berth === "SB") ? `<button type="button" class="btn" data-m="plan">${u.plan ? "Change assigned pontoon (" + berthName(u.plan) + ")" : "Assign pontoon for arrival"}</button>` : ""}
        ${u.loc === "ship" ? `<button type="button" class="btn" data-m="move">Change berth (FWD / MIDSHIP / stand-by)</button>` : ""}
        <button type="button" class="btn ${u.flag ? "danger" : ""}" data-m="status">${u.flag ? "Status: " + esc(STATUS[u.flag.status]) + " · change" : "Set status (technical issue, PVI/PDI, emergency)"}</button>
        <button type="button" class="btn" data-m="driver">Change driver</button>
        <button type="button" class="btn" data-m="cap">Set max load (now ${u.cap ?? "—"})</button>
        <button type="button" class="btn" data-m="issue">Report issue</button>
        ${canHoist ? `<button type="button" class="btn danger" data-m="stow">${u.kind === "tender" ? "Hoist · not in service" : "Release from service"}</button>` : `<span class="hint">${u.kind === "tender" ? "Hoist" : "Release"} is available when the boat is at the ship and empty.</span>`}</div>`
      : canIssues() ? `<div class="menu-list"><button type="button" class="btn" data-m="issue">Report issue</button></div>` : ""}`,
    onOpen: f => {
      f.dataset.nofocus = 1;

      f.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
        const m = b.dataset.m;
        if (m === "depart-shore") departModal(u, "shore");

          onSubmit: f2 => { const nb = f2.querySelector("#mBerth").dataset.val; if (nb !== u.berth) addEv("berth", u.id, {berth: nb}, Date.now(), `${u.full} → ${berthName(nb)}`); }});
        if (m === "driver") simpleModal(`${u.full} · Driver`, "Driver", "text", u.driver, v => addEv("driver", u.id, {driver: v}), true);
        if (m === "cap") simpleModal(`${u.full} · Max load`, "Max load (pax)", "number", u.cap ?? "", v => addEv("cap", u.id, {cap: Math.max(1, parseInt(v, 10) || 1)}));

        if (m === "stow") modal({title: u.kind === "tender" ? `Hoist ${u.full}` : `Release ${u.full}`, submit: u.kind === "tender" ? "Log hoisting" : "Release",
          body: `<p style="margin:0;color:var(--muted)">${u.kind === "tender" ? "Logs the hoisting time. The row turns grey: Not in service." : "Takes the shoretender off the board."}</p>${timeField("mT")}`,
          onSubmit: f2 => { addEv("deactivate", u.id, {}, readTime(f2, "mT", day().date), `${u.full} ${u.kind === "tender" ? "hoisted" : "released"}`); }});
      }));
    }});
}

}
const HELP = {
  log:{t:"Log", b:`<p>Every entry of today’s tender day, newest first: lowerings, departures with pax and driver, arrivals, stand-by, pontoon changes, syncs, recovery, Open Tender, notes, hoisting.</p>
    <ul><li><b>Filter</b> by boat with the menu at the top.</li><li>The tiles show the day so far: trips and pax each way, first lowering, last hoisting, average round trip.</li>
    <li><b>Deck</b>: <b>Edit</b> on a line corrects time, pax or driver; <b>Delete</b> removes it. All counts are recalculated from the log.</li>
    <li><b>Undo last</b> removes the most recent entry (tap twice).</li><li><b>Reset board…</b> clears the whole day (type RESET).</li>
    <li><b>Export CSV</b> downloads the log for Excel.</li><li><b>Close day…</b> ends the day and moves it to History (type CONFIRM).</li></ul>`},
  issues:{t:"Issues · maintenance log", b:`<p>A permanent record of tender defects and the work done, kept across days.</p>
    <ul><li><b>Report issue</b> (Deck, Tech): boat, category, date, time and what happened. Also from the tender’s card on the Board.</li>
    <li><b>Resolve</b>: write what was done; the time is recorded. <b>Reopen</b> if it comes back.</li>
    <li>Filter by boat and status to see one tender’s history. <i>Seen N× before</i> flags a repeat of the same category on that boat.</li>
    <li>Boats with an open issue show ⚠ on the Board. Hotel can read but not write.</li></ul>`},
  chat:{t:"Chat", b:`<p>Messages between Deck, Hotel and Tech for today’s tender day, live on every device.</p>
    <ul><li>The first time on a device, enter your <b>name and rank</b>. Several people share each login, so every message shows department, name and rank. <b>Change</b> it when someone else uses the device.</li>
    <li><b>Enter</b> sends, <b>Shift+Enter</b> starts a new line.</li><li>A number on the Chat tab counts unread messages; a notice appears when one arrives on another page.</li>
    <li>Each tender day has its own chat: a new day starts empty. Past chats are kept with their day in History.</li>
    <li><b>Deck</b>: <b>Clear chat…</b> deletes today’s messages for everyone (type CLEAR). Meant for tests or mistakes.</li>
    <li>For anything urgent or safety related use the radio: if the connection drops, messages arrive late.</li></ul>`},
  feedback:{t:"Feedback", b:`<p>Ideas, problems and requests about the app, from every department.</p>
    <ul><li><b>Write feedback</b>: choose Idea, Problem or Other and describe it. Your name and rank are filled in from the chat if set.</li></ul>`},
  history:{t:"History", b:`<p>Closed tender days, newest first, with trips, pax ashore and average round trip.</p>
    <ul><li>Open a day for its summary, full log and chat.</li><li><b>Export CSV</b> downloads that day’s log.</li>
    <li><b>Deck</b>: <b>Delete day</b> removes a test or duplicate day (type DELETE). Issues are kept.</li></ul>`}
};
function helpModal(k){ const h = HELP[k]; if (h) modal({title: h.t, submit:null, body:`<div class="helptxt">${h.b}</div>`}); }
function planModal(u){
  const opt = (v, l, sub, dis) => `<button type="button" data-berth="${v}" aria-pressed="${(u.plan || "") === v}" ${dis ? "disabled" : ""}>${l}<small>${sub}</small></button>`;
  const sub = b => !ST.pont[b] ? "closed" : ST.occ[b] ? "now: " + ST.occ[b].full : "free now";
  modal({title:`${u.full} · Assign pontoon`, submit:"Save",
    body:`<p class="hint" style="margin:0">Where ${esc(u.full)} will go alongside when back at the ship. Shown on the board; preselected on arrival.</p>
      <div class="choice" id="mPl" data-val="${u.plan || ""}">${opt("FWD","Forward",sub("FWD"),!ST.pont.FWD)}${opt("MID","Midship",sub("MID"),!ST.pont.MID)}${opt("","None","not assigned",false)}</div>`,
    onOpen: f => { f.dataset.nofocus = 1; bindChoice(f, "mPl"); },
    onSubmit: f => { const v = f.querySelector("#mPl").dataset.val || null; if ((u.plan || null) !== v) addEv("plan", u.id, {berth: v}, null, v ? `${u.full} → ${berthName(v)}` : `${u.full} · assignment cleared`); }});
}
function etaShore(st, u){
  if (!(u.loc === "transit" && u.dir === "shore")) return null;
  return u.since + (legAvg(st.legs.tOut) ?? legAvg(st.legs.tIn) ?? 15) * 60000;
}
function infoModal(u){
  const now = Date.now();
  const toShip = u.loc === "transit" && u.dir === "ship", toShore = u.loc === "transit" && u.dir === "shore";
  const eta = toShip ? etaShip(ST, u) : toShore ? etaShore(ST, u) : null;
  const st = !u.active ? "off" : u.loc === "transit" ? "transit" : u.loc === "shore" ? "shore" : u.berth === "SB" ? "sb" : "ship";
  const state = {off:"Not in service", transit: toShip ? "Returning to the ship" : "Heading ashore", shore:"Alongside ashore", sb:"Stand-by at the ship", ship:"Alongside " + (u.berth ? berthName(u.berth) : "the ship")}[st];
  let leg = "";
  if (eta){
    const pct = Math.round(Math.min(1, Math.max(0, (now - u.since) / Math.max(1, eta - u.since))) * 100), late = now - eta > 3 * 60000;
    leg = `<div class="ti-leg">
      <div class="ti-pt"><span>${toShip ? "Left shore" : "Left ship"}</span><b class="mono">${fmtT(u.since)}</b></div>
      <div class="ti-bar"><i style="width:${pct}%"></i><span class="ti-b" style="left:${pct}%">${boatSVG(false, u.kind === "shore" ? "shore" : "", "")}</span></div>
      <div class="ti-pt r${late ? " late" : ""}"><span>${toShip ? "Due at ship" : "Due ashore"}</span><b class="mono">${fmtT(eta)}</b><small>${etaRel(eta, now)}</small></div></div>`;
  } else if (u.active && u.since){
    leg = `<div class="ti-one"><span>${st === "sb" ? "On stand-by from" : "Arrived at"}</span><b class="mono">${fmtT(u.since)}</b></div>`;
  }
  modal({title:`${u.full}`, submit:null,
    body:`<div class="ti">
      <div class="ti-hero ti-${st}">
        <div class="ti-txt"><small>${u.kind === "shore" ? "Shoretender" : (u.side === "STBD" ? "Starboard" : "Port") + " tender"}</small><b>${state}</b><span>Driver <strong>${esc(u.driver || "—")}</strong></span></div>
        ${u.active ? `<div class="ti-pax">${ringSVG(u.pax, u.cap, 72)}<small>pax on board</small></div>` : ""}
      </div>
      ${u.flag ? `<div class="flagl f-${u.flag.status}" style="flex-direction:row;gap:6px;padding:6px 10px">■ ${esc(STATUS[u.flag.status])}${u.flag.text ? ` · <em>${esc(u.flag.text)}</em>` : ""}</div>` : ""}
      ${leg}
      ${u.plan && (toShip || st === "sb") ? `<div class="ti-pont"><span>Pontoon on arrival</span><b>${berthName(u.plan)}</b></div>` : ""}
      ${u.note ? `<div class="ti-note"><span>Note</span>${esc(u.note)}</div>` : ""}
    </div>`});
}
function statusModal(u){
  const cur = u.flag ? u.flag.status : "ok";
  const opt = (v, l, d) => `<button type="button" data-berth="${v}" aria-pressed="${cur === v}">${l}<small>${d}</small></button>`;
  modal({title:`${u.full} · Status`, submit:"Save status",
    body:`<div class="choice" id="mSt" data-val="${cur}" style="grid-template-columns:1fr 1fr">${opt("ok","Normal","in service")}${opt("tech","Technical issue","stays in service, shown to all")}${opt("pvi","PVI/PDI","shown to all; hoist when convenient")}${opt("emergency","Emergency","red alert to all")}</div>
      <label class="fld"><span>Details</span><input id="mStx" value="${esc(u.flag ? u.flag.text : "")}" placeholder="e.g. port engine overheating, returning to ship"></label>
      <label class="toggles"><label><input type="checkbox" id="mStLog" ${canIssues() ? "checked" : "disabled"}>Also add to the maintenance log (technical issue)</label></label>${timeField("mT")}`,
    onOpen: f => { f.dataset.nofocus = 1; bindChoice(f, "mSt"); },
    onSubmit: f => { const v = f.querySelector("#mSt").dataset.val, tx = f.querySelector("#mStx").value.trim(), t = readTime(f, "mT", day().date);
      addEv("status", u.id, {status:v, text:tx}, t, v === "ok" ? `${u.full} back to normal` : `${u.full} · ${STATUS[v]}`);
      if (v === "tech" && f.querySelector("#mStLog").checked && tx) S.store.saveIssue({id:"i" + uid(), unitName:u.name, category:"Other", text:tx, t, status:"open", port:day().port, dayId:day().id}); }});
}
function refreshSheet(){ /* keep an open sheet static; data refresh is shown on the board */ }
function simpleModal(title, label, type, value, apply, drivers){
  modal({title, submit:"Save",
    body: `<label class="fld"><span>${esc(label)}</span><input id="mV" type="${type}" ${type === "number" ? 'inputmode="numeric" min="1"' : ""} ${drivers ? 'list="drvList"' : ""} value="${esc(value)}" autocomplete="off"></label>${drivers ? driverList() : ""}`,
    onSubmit: f => { const v = f.querySelector("#mV").value.trim(); if (!v) return false; apply(v); toast("Saved"); }});
}
function editEvModal(id){
  const l = ST.log.find(x => x.e.id === id); if (!l) return;
  const e = l.e;
  const hasPax = e.type === "depart", hasDrv = e.type === "depart" || e.type === "activate" || e.type === "driver";
  const hasCap = e.type === "cap" || e.type === "activate" || e.type === "shore_add", hasVal = e.type === "sync";
  modal({title:`Edit · ${fullName(l.unitName)}`, submit:"Save",
    extra:`<button type="button" class="btn danger" id="mDel" style="margin-right:auto">Delete</button>`,
    body: `<p style="margin:0;color:var(--muted)">${esc(l.text)}</p>${timeField("mT", e.t)}
      ${hasPax ? `<label class="fld"><span>Pax</span><input id="mPax" type="number" inputmode="numeric" min="0" value="${e.pax ?? 0}"></label>` : ""}
      ${hasVal ? `<label class="fld"><span>Ashore value</span><input id="mVal" type="number" inputmode="numeric" min="0" value="${e.value ?? 0}"></label>` : ""}
      ${hasCap ? `<label class="fld"><span>Max load</span><input id="mCap" type="number" inputmode="numeric" min="1" value="${e.cap ?? ""}"></label>` : ""}
      ${hasDrv ? `<label class="fld"><span>Driver</span><input id="mDrv" list="drvList" value="${esc(e.driver || "")}"></label>${driverList()}` : ""}
      <span class="hint">Counts are recalculated from the corrected log.</span>`,
    onOpen: f => { f.dataset.nofocus = 1; const b = f.querySelector("#mDel"); b.addEventListener("click", () => {
      if (b.dataset.armed){ S.store.deleteEvent(day().id, e.id); closeModal(); toast("Entry deleted"); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; b.classList.add("arm"); } }); },
    onSubmit: f => {
      const p = {t: readTime(f, "mT", ymd(e.t), e.t)};
      if (hasPax) p.pax = Math.max(0, parseInt(f.querySelector("#mPax").value, 10) || 0);
      if (hasVal) p.value = Math.max(0, parseInt(f.querySelector("#mVal").value, 10) || 0);
      if (hasCap){ const c = parseInt(f.querySelector("#mCap").value, 10); if (c) p.cap = c; }
      if (hasDrv) p.driver = f.querySelector("#mDrv").value.trim();
      S.store.updateEvent(day().id, e.id, p); toast("Entry corrected");
    }});
}
function issueModal(existing, unitName){
  const i = existing || {};
  const units = issueUnits(), t = i.t ?? Date.now();
  modal({title: existing ? `Edit issue · ${fullName(i.unitName)}` : "Report issue", submit: existing ? "Save" : "Log issue",
    extra: existing ? `<button type="button" class="btn danger" id="mDel" style="margin-right:auto">Delete</button>` : "",
    body: `<div class="two"><label class="fld"><span>Unit</span><select id="mU">${units.map(n => `<option value="${esc(n)}" ${(i.unitName || unitName) === n ? "selected" : ""}>${esc(fullName(n))}</option>`).join("")}</select></label>
      <label class="fld"><span>Category</span><select id="mCat">${CATEGORIES.map(c => `<option ${i.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label></div>
      <div class="two"><label class="fld"><span>Date</span><input id="mD" type="date" value="${ymd(t)}"></label><label class="fld"><span>Time (24h)</span>${hmInput("mTi", fmtT(t))}</label></div>
      <label class="fld"><span>Description</span><textarea id="mTx" required placeholder="What happened, and what was done">${esc(i.text || "")}</textarea></label>
      ${existing && existing.status === "resolved" ? `<label class="fld"><span>Resolution</span><textarea id="mRes">${esc(i.resolution || "")}</textarea></label>` : ""}<div id="mWarn"></div>`,
    onOpen: f => { f.dataset.nofocus = 1; const b = f.querySelector("#mDel"); if (b) b.addEventListener("click", () => {
      if (b.dataset.armed){ S.store.deleteIssue(i.id); closeModal(); toast("Issue deleted"); } else { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; b.classList.add("arm"); } }); },
    onSubmit: f => {
      const text = f.querySelector("#mTx").value.trim();
      if (!text){ f.querySelector("#mWarn").innerHTML = `<div class="warnbox">Add a short description.</div>`; return false; }
      const tt = hmToMs(f.querySelector("#mD").value, normHM(f.querySelector("#mTi").value)) ?? Date.now();
      const rec = {id: i.id || "i" + uid(), unitName: f.querySelector("#mU").value, category: f.querySelector("#mCat").value, text, t: tt,
        status: i.status || "open", port: i.port ?? (day() ? day().port : ""), dayId: i.dayId ?? (day() ? day().id : null)};
      const r = f.querySelector("#mRes"); if (r) rec.resolution = r.value.trim();
      S.store.saveIssue(rec); toast(existing ? "Issue updated" : `Issue logged on ${fullName(rec.unitName)}`);
    }});
}
function resolveModal(i){
  modal({title:`Resolve · ${fullName(i.unitName)}`, submit:"Mark resolved",
    body: `<p style="margin:0">${esc(i.text)}</p><label class="fld"><span>What was done</span><textarea id="mRes" placeholder="e.g. Strainer cleaned, tested OK"></textarea></label>
      <div class="two"><label class="fld"><span>Date</span><input id="mD" type="date" value="${ymd(Date.now())}"></label><label class="fld"><span>Time (24h)</span>${hmInput("mTi", fmtT(Date.now()))}</label></div>`,
    onSubmit: f => { S.store.saveIssue({id:i.id, status:"resolved", resolution: f.querySelector("#mRes").value.trim(), resolvedAt: hmToMs(f.querySelector("#mD").value, normHM(f.querySelector("#mTi").value)) ?? Date.now()}); toast("Issue resolved"); }});
}
function csvFor(d, st){
  const rows = [["Date","Port","Time","Unit","Event","Pax","Driver"]];
  st.log.forEach(l => rows.push([d.date, d.port, fmtT(l.e.t), l.unitName, l.text, l.pax ?? "", l.driver || ""]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv"}));
  a.download = `tender-log_${d.date}_${(d.port || "port").replace(/\W+/g, "-")}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------------- event wiring ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !$("#app").contains(el)) return;
  const act = el.dataset.act, u = el.dataset.u && ST ? ST.units[el.dataset.u] : null;
  keepAwake();
  switch (act){
    case "theme": { lsSet("tb.theme", isDark() ? "light" : "dark"); applyTheme(); render(); break; }
    case "signout": S.store.signOut(); break;
    case "demo-role": S.role = el.dataset.r; render(); break;
    case "demo-reset": S.store.reset(); toast("Sample data reloaded"); break;
    case "open-day": dayModal(null); break;
    case "edit-day": dayModal(day()); break;
    case "sync": syncModal(); break;
    case "rec": S.recOpen = !S.recOpen; render(); break;
    case "rec-start": addEv("recovery", null, {on:true}, null, "Recovery started"); break;
    case "rec-stop": addEv("recovery", null, {on:false}, null, "Recovery ended"); break;
    case "legend": legendModal(); break;
    case "help": helpModal(el.dataset.k); break;
    case "fb-new": feedbackModal(); break;
    case "online": onlineModal(); break;
    case "fb-toggle": { const f = (S.data.feedback || []).find(x => x.id === el.dataset.id); if (f) S.store.saveFeedback({id:f.id, status: f.status === "done" ? "new" : "done"}); break; }
    case "status-ok": addEv("status", u.id, {status:"ok", text:""}, null, `${u.full} back in service`); break;
    case "chat-id": identityModal(); break;
    case "chat-clear": confirmTyped({title:"Clear today’s chat", word:"CLEAR", button:"Clear chat",
        text:`This permanently deletes all ${chatMsgs().length} messages of today’s chat, for everyone. Use it for test messages or messages sent by mistake. This cannot be undone.`,
        onConfirm: () => { S.store.deleteMessages(chatMsgs().map(m => m.id)); toast("Chat cleared"); }}); break;
    case "ot-on": modal({title:"Declare Open Tender", submit:"Declare Open Tender",
        body:`<p style="margin:0">Guests no longer need tender tickets and go straight to the pontoon. Open Tender stays on for the rest of the day.</p><p class="hint" style="margin:0">Declared by ${DEPT[S.role]}.</p>`,
        onSubmit: () => { addEv("opentender", null, {on:true, by: DEPT[S.role]}); toast("Open Tender declared"); }}); break;
    case "ot-off": modal({title:"Cancel Open Tender?", submit:"Cancel Open Tender", danger:true,
        body:`<div class="warnbox">Open Tender is normally valid for the whole day. Cancel it only if it was declared by mistake or tender tickets are needed again.</div>`,
        onSubmit: () => { addEv("opentender", null, {on:false, by: DEPT[S.role]}); toast("Open Tender cancelled"); }}); break;
    case "pontoons": pontoonModal(); break;
    case "sheet": sheetModal(u); break;
    case "info": infoModal(u); break;
    case "plan": planModal(u); break;
    case "depart-shore": departModal(u, "shore"); break;
    case "depart-ship": departModal(u, "ship"); break;
    case "arrive-shore": addEv("arrive", u.id, {at:"shore"}, null, `${u.full} alongside Shore · ${u.pax} landed`); break;
    case "arrive-ship": arriveShipModal(u); break;
    case "berth": addEv("berth", u.id, {berth: el.dataset.b}, null, `${u.full} alongside ${berthName(el.dataset.b)}${u.pax ? " · " + u.pax + " back on board" : ""}`); break;
    case "activate": activateModal(u); break;
    case "add-shore": shoreModal(); break;
    case "undo-last": { const l = ST && ST.log.slice().sort((a,b) => (b.e.c||0) - (a.e.c||0))[0]; if (!l) break;
      if (el.dataset.armed){ S.store.deleteEvent(day().id, l.e.id); toast(`Undone: ${l.unitName} · ${l.text}`); }
      else { el.dataset.armed = "1"; el.classList.add("arm"); el.textContent = `Tap again: undo ${l.unitName} · ${l.text.split(" · ")[0]}`; setTimeout(() => render(), 5000); }
      break; }
    case "csv": csvFor(day(), ST); break;
    case "close-day": closeDayModal(); break;
    case "edit-ev": editEvModal(el.dataset.id); break;
    case "new-issue": issueModal(null, S.issueUnit !== "all" ? S.issueUnit : null); break;
    case "resolve": { const i = S.data.issues.find(x => x.id === el.dataset.id); if (i) resolveModal(i); break; }
    case "reopen": S.store.saveIssue({id: el.dataset.id, status:"open", resolvedAt:null}); toast("Issue reopened"); break;
    case "edit-issue": { const i = S.data.issues.find(x => x.id === el.dataset.id); if (i) issueModal(i); break; }
    case "hist-open": openHist(el.dataset.id); break;
    case "reset-day": resetDayModal(); break;
    case "del-day": { const d = S.data.days.find(x => x.id === S.hist); if (d) deleteDayModal(d); break; }
    case "hist-back": S.hist = null; S.histEvents = null; render(); break;
    case "csv-hist": { const d = S.data.days.find(x => x.id === S.hist); if (d && S.histEvents) csvFor(d, compute(d, S.histEvents)); break; }
  }
});
document.addEventListener("click", e => { const sm = e.target.closest && e.target.closest("#statsBox > summary"); if (sm) lsSet("tom.stats." + S.role, sm.parentElement.open ? "0" : "1"); });
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.act) return;
  if (el.dataset.act === "log-unit"){ S.logUnit = el.value; render(); }
  if (el.dataset.act === "issue-unit"){ S.issueUnit = el.value; render(); }
  if (el.dataset.act === "issue-status"){ S.issueStatus = el.value; render(); }
});
async function openHist(id){
  S.hist = id; S.histEvents = null; render();
  const d = S.data.days.find(x => x.id === id);
  S.histEvents = d && d.status === "open" && S.data.currentDay && S.data.currentDay.id === id ? S.data.events : await S.store.getEvents(id);
  try { S.histMsgs = await S.store.getMessages(id); } catch(e){ S.histMsgs = []; }
  render();
}
function route(){
  const h = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(h) ? h : "board";
  if (S.view !== "history"){ S.hist = null; S.histEvents = null; }
  render(); window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
setInterval(() => { if (S.role && !$("#modal-root").innerHTML && S.view === "board") render(); }, 30000);

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme();
  const h = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(h) ? h : "board";
  if (CONFIG.firebase){
    $("#app").innerHTML = `<div class="wrap login"><p>Connecting…</p></div>`;
    try { S.store = await createFirebaseStore(); }
    catch(e){ $("#app").innerHTML = `<div class="wrap login"><div class="emptystate"><h2>Cannot reach the server</h2><p>${esc(e.message)}. Check the ship’s internet connection and reload.</p></div></div>`; return; }
    S.store.onChange(setData);
    S.store.onAuth(user => {
      S.role = user ? (Object.keys(CONFIG.accounts).find(k => CONFIG.accounts[k] === user.email) || null) : null;
      if (user && !S.role){ toast("This account has no access"); S.store.signOut(); }
      if (!user){ S.data = {days:[], currentDay:null, events:[], issues:[], messages:[]}; ST = null; }
      render(); if (user){ keepAwake(); heartbeat(); }
    });
  } else {
    S.store = createLocalStore();
    S.role = "deck";
    S.store.seedIfEmpty();
    S.store.onChange(setData); heartbeat();
  }
})();
</script>
