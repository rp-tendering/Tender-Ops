<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13212f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tender Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tender Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: status deck (counts + recovery estimate), then the board as four lanes running ship → shore, stowed rack below. Signal orange = tenders, STBD green / PORT red. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#13212f; --muted:#5a6b7d; --line:#d3dbe4;
  --accent:#e4570f; --accent-ink:#ffffff; --accent-soft:#fde8dc;
  --sea:#1f6391; --sea-tint:#dde9f3; --hull:#fbfcfd;
  --ok:#2b8a3e; --warn:#d97706; --crit:#d63031; --track:#e2e7ed;
  --stbd:#1f9d55; --port:#d63031;
  --shadow:0 1px 2px rgba(19,33,47,.06),0 2px 8px rgba(19,33,47,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a141e; --surface:#112131; --surface-2:#0d1a27; --ink:#e4ecf3; --muted:#8ea3b7; --line:#22374b;
    --accent:#ff7a33; --accent-ink:#1a0d04; --accent-soft:#3a2214;
    --sea:#5aaee0; --sea-tint:#0f2638; --hull:#dfe7ee;
    --ok:#51cf66; --warn:#fcc419; --crit:#ff6b6b; --track:#1d3245;
    --stbd:#51cf66; --port:#ff6b6b; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a141e; --surface:#112131; --surface-2:#0d1a27; --ink:#e4ecf3; --muted:#8ea3b7; --line:#22374b;
  --accent:#ff7a33; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --sea:#5aaee0; --sea-tint:#0f2638; --hull:#dfe7ee;
  --ok:#51cf66; --warn:#fcc419; --crit:#ff6b6b; --track:#1d3245;
  --stbd:#51cf66; --port:#ff6b6b; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:46px;height:20px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:6px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--warn)}
.chip.role{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 8px;cursor:pointer;font-size:13px;font-weight:600}
.icon-btn:hover{background:var(--surface-2)}

.demo{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:7px}
.demo b{font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkish{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

main{padding-block:16px 60px;display:flex;flex-direction:column;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.1;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.arm{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.small{min-height:30px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* day strip */
.daybar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.daybar h1{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;letter-spacing:.01em;line-height:1;text-wrap:balance}
.daybar .sub{color:var(--muted);font-size:14px}
.daybar .spacer{flex:1}
.daybar .acts{display:flex;gap:8px;flex-wrap:wrap}

/* counts */
.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.kpi .lab small{font-family:var(--f-body);font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:500}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpi.ashore{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.kpi.ashore .lab{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.kpi.ashore .val{color:var(--accent)}
.kpi .foot{font-size:12px;color:var(--muted);min-height:16px}
.kpi.ashore .foot{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.kpi .sync{margin-top:6px;align-self:flex-start;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--surface) 35%,transparent)}
.kpi .sync:hover{background:color-mix(in srgb,var(--surface) 12%,transparent)}

.recov{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.recov .lab{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.recov .line{font-size:15px;line-height:1.35}
.recov .line b{font-weight:700}
.recov .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.recov .stats div{display:flex;flex-direction:column;min-width:0}
.recov .stats span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.recov .stats b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.recov .verdict{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:180px}
.lane.transit{background:var(--sea-tint)}
.lane > header{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:2px 4px}
.lane > header svg{width:30px;height:18px;flex:none;color:var(--muted)}
.lane > header .n{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.lane .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.cards{display:flex;flex-direction:column;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.card .row1{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.tname{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em;white-space:nowrap}
.side{font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:5px;border:1.5px solid currentColor}
.side.STBD{color:var(--stbd)} .side.PORT{color:var(--port)} .side.SHORE{color:var(--sea)}
.card .more{margin-left:auto}
.card .vis{display:flex;align-items:center;gap:10px}
.card .vis .boat{flex:1;min-width:0;height:auto;max-width:150px}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.card .meta b{color:var(--ink);font-weight:600}
.card .dir{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
.card .flag{font-size:12.5px;font-weight:600;color:var(--crit);display:flex;gap:6px;align-items:center}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts .btn{flex:1 1 auto}
.ring{flex:none}
.ring .trk{fill:none;stroke:var(--track);stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke .3s}
.ring.ok .val{stroke:var(--ok)} .ring.warn .val{stroke:var(--warn)} .ring.crit .val{stroke:var(--crit)}
.ring .n{font-family:var(--f-display);font-weight:700;font-size:24px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.ring .c{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);text-anchor:middle}
.ring.crit .n{fill:var(--crit)}

.boat .b-hull{fill:var(--hull);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.boat .b-can,.boat .b-helm{fill:var(--accent);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.boat.shore .b-can,.boat.shore .b-helm{fill:var(--sea)}
.boat.muted .b-can,.boat.muted .b-helm{fill:var(--track)}
.boat .b-win{fill:var(--ink);opacity:.72}
.boat .b-mast{stroke:var(--ink);stroke-width:1.4}
.boat .b-light{fill:var(--warn)}
.boat.muted .b-light{fill:var(--muted)}
.boat .b-rub{stroke:var(--ink);stroke-width:.8;opacity:.45}
.boat .b-wave{fill:none;stroke:var(--sea);stroke-width:1.4;stroke-linecap:round}
.boat.muted .b-wave{stroke:var(--line)}
@media (prefers-reduced-motion: no-preference){
  .lane.transit .boat g.hullg{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(1.2px) rotate(-.6deg)}}
}

/* stowed rack */
.rack{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rack h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rack h2 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:500}
.rack .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.stow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);min-width:0}
.stow .boat{width:70px;flex:none}
.stow .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.stow .txt b{font-family:var(--f-display);font-size:20px;line-height:1}
.stow .txt span{font-size:12px;color:var(--muted)}
.stow .btn{flex:none}

/* pages */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;margin-right:auto;line-height:1.05}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.f,input.f,textarea.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--muted);text-align:left;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.u{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
td.ra{white-space:nowrap;text-align:right}
tr.k-sync td{background:color-mix(in srgb,var(--sea) 8%,transparent)}
tr.k-lower td,tr.k-hoist td{background:color-mix(in srgb,var(--accent) 7%,transparent)}

.issues{display:flex;flex-direction:column;gap:8px}
.issue{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--surface)}
.issue .who2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;min-width:48px}
.issue .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.issue .body p{margin:0;overflow-wrap:anywhere}
.issue .when{font-size:12.5px;color:var(--muted)}
.issue .res{font-size:13px;color:var(--muted);border-left:2px solid var(--ok);padding-left:8px;margin-top:2px}
.issue .side-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.status.open{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.status.resolved{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dayc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.dayc:hover{border-color:var(--muted)}
.dayc b{font-family:var(--f-display);font-size:22px;line-height:1}
.dayc .d{font-size:13px;color:var(--muted)}
.dayc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.dayc .g span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block}
.dayc .g i{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:19px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sumgrid div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sumgrid span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sumgrid b{font-family:var(--f-display);font-size:22px}

.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.emptystate h2{font-family:var(--f-display);font-size:28px;margin:0}
.emptystate p{margin:0;color:var(--muted);max-width:52ch}
.emptystate .boat{width:180px}

/* login */
.login{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:30px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-size:32px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.login .err{color:var(--crit);font-size:14px;min-height:18px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,14,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:16px;width:min(460px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal header{padding:14px 16px 4px;display:flex;align-items:center;gap:10px}
.modal header h3{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.1;flex:1}
.modal .mb{padding:8px 16px 4px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 16px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld > span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;min-height:42px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld input.big{font-family:var(--f-display);font-size:34px;font-weight:700;text-align:center;padding:4px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1}
.paxprev{display:flex;align-items:center;gap:14px;justify-content:center}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;min-height:46px;font-size:15px}

const ymd = ms => { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };

const hmToMs = (dateStr, hm) => { if (!dateStr || !hm) return null; const [y,m,d] = dateStr.split("-").map(Number); const [h,mi] = hm.split(":").map(Number); return new Date(y, m-1, d, h, mi).getTime(); };
const fmtDur = min => { if (min == null || !isFinite(min)) return "—"; const neg = min < 0; min = Math.abs(Math.round(min)); const h = Math.floor(min/60), m = min % 60; return (neg?"−":"") + (h ? h + "h " + pad(m) + "m" : m + " min"); };

/* ---------------- graphics ---------------- */

  for (let i = 0; i < 7; i++) wins += `<rect class="b-win" x="${24 + i*9.5}" y="19.5" width="6" height="5" rx="1"/>`;

function ringSVG(p, cap, size=82){
  const r = 31, C = 2 * Math.PI * r;
  const ratio = cap ? p / cap : 0;
  const cls = !cap ? "none" : ratio >= 0.95 ? "crit" : ratio >= 0.8 ? "warn" : "ok";
  const off = C * (1 - Math.min(Math.max(ratio, 0), 1));
  return `<svg class="ring ${cls}" viewBox="0 0 80 80" width="${size}" height="${size}" role="img" aria-label="${p} of ${cap || "unset"} pax">
    <circle cx="40" cy="40" r="${r}" class="trk"/>
    ${p > 0 ? `<circle cx="40" cy="40" r="${r}" class="val" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 40 40)"/>` : ""}
    <text x="40" y="37" class="n">${p}</text><text x="40" y="55" class="c">/${cap || "—"}</text></svg>`;
}
const SHIP_ICON = `<svg viewBox="0 0 30 18" aria-hidden="true"><path d="M1 11h28l-3 5H5z" fill="currentColor"/><path d="M5 11V7h17l3 4M9 7V4h9v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
const WAIT_ICON = `<svg viewBox="0 0 30 18" aria-hidden="true"><circle cx="15" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 5.5V9l2.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const SEA_ICON = `<svg viewBox="0 0 30 18" aria-hidden="true"><path d="M2 7q3.25-3 6.5 0t6.5 0 6.5 0 6.5 0M2 13q3.25-3 6.5 0t6.5 0 6.5 0 6.5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const PIER_ICON = `<svg viewBox="0 0 30 18" aria-hidden="true"><path d="M2 8h26" stroke="currentColor" stroke-width="2.2"/><path d="M6 8v9M15 8v9M24 8v9" stroke="currentColor" stroke-width="1.8"/><path d="M11 8V4h3v4" fill="currentColor"/></svg>`;
const LANE_ICONS = {ship:SHIP_ICON, standby:WAIT_ICON, transit:SEA_ICON, shore:PIER_ICON};

/* ---------------- core model: replay events ---------------- */
function compute(day, events){
  const units = {}, order = [];
  for (const t of TENDERS){
    units[t.id] = {id:t.id, name:"T"+t.num, kind:"tender", side:t.side, active:false, loc:"stowed", dir:null, pax:0, cap:null, driver:"", since:null, lowered:null, hoisted:null, tripsOut:0, tripsBack:0, paxOut:0, paxBack:0, lastShipDep:null};
    order.push(t.id);
  }
  let ashore = 0;
  const cycles = [], log = [], drivers = new Set();
  let firstLowered = null, lastHoisted = null;
  const evs = (events || []).slice().sort((a,b) => a.t - b.t || a.c - b.c);
  for (const e of evs){
    let u = units[e.unit], text = "", kind = e.type, pax = null;
    if (!u && e.type !== "sync" && e.type !== "shore_add") continue;
    switch (e.type){
      case "shore_add":
        units[e.unit] = u = {id:e.unit, name:e.name, kind:"shore", side:"SHORE", active:true, loc:e.at || "shore", dir:null, pax:0, cap:e.cap || null, driver:e.driver || "", since:e.t, lowered:null, hoisted:null, tripsOut:0, tripsBack:0, paxOut:0, paxBack:0, lastShipDep:null};
        order.push(e.unit);
        text = `Shoretender on service at ${u.loc === "ship" ? "ship" : "shore"} · max ${u.cap ?? "—"}`;
        break;
      case "activate":
        Object.assign(u, {active:true, loc:"ship", dir:null, pax:0, since:e.t, lastShipDep:null});
        if (e.cap) u.cap = e.cap;
        if (e.driver != null && e.driver !== "") u.driver = e.driver;
        if (u.kind === "tender"){ u.lowered = e.t; u.hoisted = null; if (firstLowered == null) firstLowered = e.t; kind = "lower"; text = `Lowered to the water · max ${u.cap ?? "—"}`; }
        else text = "Back on service, alongside ship";
        break;
      case "deactivate":
        Object.assign(u, {active:false, loc:"stowed", dir:null, pax:0, since:e.t, lastShipDep:null});
        if (u.kind === "tender"){ u.hoisted = e.t; lastHoisted = e.t; kind = "hoist"; text = "Hoisted and stowed"; }
        else text = "Released from service";
        break;
      case "depart": {
        pax = Math.max(0, +e.pax || 0);
        if (e.driver) u.driver = e.driver;
        if (e.dir === "shore"){
          u.paxOut += pax; u.tripsOut++;
          if (u.lastShipDep != null) cycles.push({unit:u.id, t:e.t, min:(e.t - u.lastShipDep) / 60000});
          u.lastShipDep = e.t;
        } else { ashore -= pax; u.paxBack += pax; u.tripsBack++; }
        Object.assign(u, {loc:"transit", dir:e.dir, pax, since:e.t});
        text = `Departed → ${e.dir === "shore" ? "Shore" : "Ship"}`;
        break;
      }
      case "arrive":
        pax = u.pax;
        if (e.at === "shore"){ ashore += u.pax; text = `Alongside Shore · ${u.pax} landed`; }
        else text = `Alongside Ship · ${u.pax} back on board`;
        Object.assign(u, {loc:e.at, dir:null, pax:0, since:e.t});
        break;
      case "standby": Object.assign(u, {loc:"standby", dir:null, since:e.t, lastShipDep:null}); text = "Stand-by in the water"; break;
      case "alongside": Object.assign(u, {loc:e.at, dir:null, since:e.t}); text = `Alongside ${e.at === "ship" ? "Ship" : "Shore"} from stand-by`; break;
      case "cap": u.cap = e.cap; text = `Max load set to ${e.cap}`; break;
      case "driver": u.driver = e.driver; text = `Driver changed to ${e.driver}`; break;
      case "sync": { const prev = ashore; ashore = +e.value; const d = ashore - prev; text = `Ashore synced to ${num(ashore)} (count was ${num(prev)}, Δ ${d >= 0 ? "+" : "−"}${num(Math.abs(d))})`; break; }
    }
    if (u && u.driver) drivers.add(u.driver);
    log.push({e, unitName: u ? u.name : "—", unitId: u ? u.id : null, text, kind, pax, driver: (e.type === "depart" || e.type === "activate") ? (u ? u.driver : "") : (e.type === "driver" ? e.driver : "")});
  }
  const list = order.map(id => units[id]);
  const onTenders = list.filter(u => u.loc === "transit").reduce((a,u) => a + u.pax, 0);
  const total = day ? (+day.total || 0) : 0;
  // round trip = ship departure → next ship departure of the same unit (stand-by breaks the chain)
  let cycleAvg = null;
  const recent = cycles.slice(-8).map(c => c.min).filter(m => m > 3);
  if (recent.length >= 2){
    const sorted = recent.slice().sort((a,b) => a-b), med = sorted[Math.floor(sorted.length/2)];
    const keep = recent.filter(m => m <= med * 2.2);
    cycleAvg = keep.reduce((a,b) => a+b, 0) / keep.length;
  }
  const tripsOut = list.reduce((a,u) => a + u.tripsOut, 0), tripsBack = list.reduce((a,u) => a + u.tripsBack, 0);
  const paxOut = list.reduce((a,u) => a + u.paxOut, 0), paxBack = list.reduce((a,u) => a + u.paxBack, 0);
  return {units, list, ashore, onTenders, aboard: total - ashore - onTenders, total, cycles, cycleAvg, log, drivers:[...drivers], tripsOut, tripsBack, paxOut, paxBack, firstLowered, lastHoisted};
}

function estimate(day, st, now){
  const active = st.list.filter(u => u.active);
  const caps = active.map(u => u.cap).filter(Boolean);
  const avgCap = caps.length ? caps.reduce((a,b) => a+b, 0) / caps.length : null;
  const cycle = st.cycleAvg ?? (+day.plannedCycle || 30);
  const cycleSrc = st.cycleAvg != null ? "measured" : "planned";
  let last = hmToMs(day.date, day.lastTender);
  if (last != null && day.openedAt && last < day.openedAt - 3600e3) last += 864e5;
  const remain = last != null ? (last - now) / 60000 : null;
  const A = Math.max(0, st.ashore);
  const r = {A, avgCap, cycle, cycleSrc, last, remain, activeCount: active.length, trips:null, needed:null, recoverable:null, perUnit:null};
  if (!avgCap) return r;
  r.trips = Math.ceil(A / avgCap);
  if (A === 0) r.needed = 0;
  else if (remain != null && remain > 0){ r.perUnit = Math.floor(remain / cycle) + 1; r.needed = Math.min(active.length, Math.ceil(r.trips / r.perUnit)); }
  else r.needed = Math.min(active.length, r.trips);
  r.recoverable = Math.max(0, active.length - r.needed);
  return r;
}

/* ---------------- stores ---------------- */
function createLocalStore(){
  const KEY = "tenderboard.demo.v1";
  let mem = null; const listeners = [];
  const read = () => { const s = lsGet(KEY); if (s){ try { return JSON.parse(s); } catch(e){} } return mem; };
  const db = () => read() || {days:{}, events:{}, issues:{}};
  const write = d => { mem = d; lsSet(KEY, JSON.stringify(d)); emit(); };
  function snap(){
    const d = db();
    const days = Object.values(d.days).sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.openedAt||0) - (a.openedAt||0));
    const currentDay = days.find(x => x.status === "open") || null;
    return {days, currentDay, events: currentDay ? (d.events[currentDay.id] || []) : [], issues: Object.values(d.issues).sort((a,b) => b.t - a.t), offline:false, pending:false};
  }
  function emit(){ const s = snap(); listeners.forEach(f => f(s)); }
  window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
  const mut = fn => { const d = db(); fn(d); write(d); return Promise.resolve(); };
  return {
    mode:"demo",
    onChange(f){ listeners.push(f); f(snap()); },
    seedIfEmpty(){ if (!read()) write(makeSample()); },
    reset(){ write(makeSample()); },
    saveDay: day => mut(d => { d.days[day.id] = Object.assign({}, d.days[day.id], clean(day)); }),
    addEvent: (dayId, e) => mut(d => { (d.events[dayId] = d.events[dayId] || []).push(clean(e)); }),
    updateEvent: (dayId, id, p) => mut(d => { const a = d.events[dayId] || []; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = Object.assign({}, a[i], clean(p)); }),
    deleteEvent: (dayId, id) => mut(d => { d.events[dayId] = (d.events[dayId] || []).filter(x => x.id !== id); }),
    saveIssue: is => mut(d => { d.issues[is.id] = Object.assign({}, d.issues[is.id], clean(is)); }),
    deleteIssue: id => mut(d => { delete d.issues[id]; }),
    getEvents: async dayId => (db().events[dayId] || []).slice()
  };
}

async function createFirebaseStore(){
  const V = "10.12.2";
  for (const m of ["app","auth","firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  firebase.initializeApp(CONFIG.firebase);
  const fs = firebase.firestore();
  try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){}
  const auth = firebase.auth();
  let days = [], events = [], issues = [], curId = null, unsubEv = null, unsubs = [], offline = !navigator.onLine, pending = false;
  const listeners = [];
  const emit = () => { const currentDay = days.find(d => d.status === "open") || null; const s = {days, currentDay, events: currentDay && currentDay.id === curId ? events : [], issues, offline, pending}; listeners.forEach(f => f(s)); };
  const fail = err => { console.error(err); toast(err.code === "permission-denied" ? "Access denied by the server" : "Sync error: " + (err.message || err)); };
  const dayRef = id => fs.collection("days").doc(id);
  function watchEvents(id){
    if (unsubEv) unsubEv(); unsubEv = null; events = []; curId = id;
    if (!id) return;
    unsubEv = dayRef(id).collection("events").onSnapshot({includeMetadataChanges:true}, s => {
      events = s.docs.map(d => d.data()); pending = s.metadata.hasPendingWrites; offline = s.metadata.fromCache && !navigator.onLine; emit();
    }, fail);
  }
  function start(){
    unsubs.push(fs.collection("days").orderBy("date","desc").limit(150).onSnapshot(s => {
      days = s.docs.map(d => d.data());
      const cur = days.find(d => d.status === "open"); const id = cur ? cur.id : null;
      if (id !== curId) watchEvents(id);
      emit();
    }, fail));
    unsubs.push(fs.collection("issues").orderBy("t","desc").limit(1000).onSnapshot(s => { issues = s.docs.map(d => d.data()); emit(); }, fail));
  }
  function stop(){ unsubs.forEach(u => u()); unsubs = []; if (unsubEv) unsubEv(); unsubEv = null; curId = null; days = []; events = []; issues = []; }
  addEventListener("online", () => { offline = false; emit(); });
  addEventListener("offline", () => { offline = true; emit(); });
  const w = p => { p.catch(fail); return Promise.resolve(); };
  return {
    mode:"live",
    onAuth(cb){ auth.onAuthStateChanged(u => { stop(); if (u) start(); cb(u); }); },
    signIn: (role, pw) => auth.signInWithEmailAndPassword(CONFIG.accounts[role], pw),
    signOut: () => auth.signOut(),
    onChange(f){ listeners.push(f); },
    saveDay: d => w(dayRef(d.id).set(clean(d), {merge:true})),
    addEvent: (dayId, e) => w(dayRef(dayId).collection("events").doc(e.id).set(clean(e))),
    updateEvent: (dayId, id, p) => w(dayRef(dayId).collection("events").doc(id).update(clean(p))),
    deleteEvent: (dayId, id) => w(dayRef(dayId).collection("events").doc(id).delete()),
    saveIssue: is => w(fs.collection("issues").doc(is.id).set(clean(is), {merge:true})),
    deleteIssue: id => w(fs.collection("issues").doc(id).delete()),
    getEvents: async dayId => (await dayRef(dayId).collection("events").get()).docs.map(d => d.data())
  };
}

/* ---------------- sample data (demo mode only) ---------------- */
function makeSample(){
  let s = 11; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a,b) => Math.round(a + rnd() * (b - a));
  const M = 60000, now = Date.now();
  const out = {days:{}, events:{}, issues:{}};
  const mk = (type, unit, t, extra) => Object.assign({id:uid() + ri(0,9999), c: t * 1000 + ri(0,999), type, unit, t}, extra || {});

  function buildDay(o){
    const ev = [];
    const slots = [];
    const lastMs = o.lastTender;
    for (const u of o.units){
      let t = o.start + u.off * M;
      if (u.kind === "shore") ev.push(mk("shore_add", u.id, t, {name:u.name, cap:u.cap, driver:u.driver, at:"ship"}));
      else ev.push(mk("activate", u.id, t, {cap:u.cap, driver:u.driver}));
      t += ri(4,8) * M;
      while (true){
        if (t > o.end) break;
        if (o.complete && t > lastMs + 5*M) break;
        if (u.stopAt && t > u.stopAt) break;
        slots.push({t, u, k:"depShip"}); t += ri(11,14) * M;
        slots.push({t, u, k:"arrShore"}); t += ri(4,8) * M;
        slots.push({t, u, k:"depShore"}); t += ri(11,14) * M;
        slots.push({t, u, k:"arrShip"}); t += ri(5,9) * M;
        u.endT = t;
      }
    }
    slots.sort((a,b) => a.t - b.t);
    let ashore = 0, outSum = 0; const carry = {}; const cap0 = (o.total || 4000) * 0.68;
    const span = lastMs - o.start;
    for (const sl of slots){
      if (sl.t > o.end) break;
      const f = (sl.t - o.start) / span, u = sl.u, cap = u.cap;
      if (sl.k === "depShip"){
        let p = f < 0.22 ? ri(cap - 35, cap) : f < 0.45 ? ri(30, 90) : f < 0.7 ? ri(4, 30) : ri(0, 4);
        p = Math.max(0, Math.min(p, Math.round(cap0 - outSum))); outSum += p;
        carry[u.id] = p; ev.push(mk("depart", u.id, sl.t, {dir:"shore", pax:p}));
      } else if (sl.k === "arrShore"){ ashore += carry[u.id] || 0; carry[u.id] = 0; ev.push(mk("arrive", u.id, sl.t, {at:"shore"})); }
      else if (sl.k === "depShore"){
        let p = f < 0.35 ? ri(0, 6) : f < 0.65 ? ri(25, 90) : f < 0.85 ? ri(90, cap) : cap;
        p = Math.max(0, Math.min(p, ashore)); ashore -= p; carry[u.id] = p;
        ev.push(mk("depart", u.id, sl.t, {dir:"ship", pax:p}));
      } else { carry[u.id] = 0; ev.push(mk("arrive", u.id, sl.t, {at:"ship"})); }
    }
    if (o.complete){
      for (const u of o.units) ev.push(mk(u.kind === "shore" ? "deactivate" : "deactivate", u.id, (u.endT || o.end) + ri(6,14) * M));
    }
    return ev;
  }

  // a finished day three days ago
  const pastBase = new Date(now - 3 * 864e5); pastBase.setHours(7, 20, 0, 0);
  const pStart = pastBase.getTime(), pLast = pStart + (10*60 + 40) * M;
  const pastId = "d" + uid();
  const pastEv = buildDay({total:4312, start:pStart, lastTender:pLast, end:pLast + 60*M, complete:true, units:[
    {id:"T11", cap:165, driver:"Marco", off:0}, {id:"T15", cap:165, driver:"Ryan", off:6}, {id:"T14", cap:165, driver:"Dimitri", off:12},
    {id:"T16", cap:165, driver:"Joel", off:18}, {id:"T17", cap:165, driver:"Ivan", off:30}]});
  out.days[pastId] = {id:pastId, port:"Santorini", date:ymd(pStart), total:4312, lastTender:fmtT(pLast), plannedCycle:32, status:"closed", openedAt:pStart - 30*M, closedAt:pLast + 90*M};
  out.events[pastId] = pastEv;
  const pst = compute(out.days[pastId], pastEv);
  out.days[pastId].summary = summaryOf(pst);

  // today, in progress
  const start = now - 5.5 * 3600e3, last = now + 2 * 3600e3 + 10*M;
  const id = "d" + uid();
  const units = [
    {id:"T11", cap:170, driver:"Marco", off:0}, {id:"T15", cap:170, driver:"Ryan", off:5},
    {id:"T14", cap:170, driver:"Dimitri", off:10}, {id:"T17", cap:170, driver:"Joel", off:16, stopAt: now - 50*M},
    {id:"S1", kind:"shore", name:"Kotor Star", cap:120, driver:"Local crew", off:45}
  ];
  const ev = buildDay({total:4280, start, lastTender:last, end:now, complete:false, units});
  ev.push(mk("driver", "T11", start + 190*M, {driver:"Aldo"}));
  out.days[id] = {id, port:"Kotor", date:ymd(start), total:4280, lastTender:fmtT(last), plannedCycle:32, status:"open", openedAt:start - 20*M};
  // T17 waits on stand-by once its loop ends
  const t17 = ev.filter(e => e.unit === "T17").sort((a,b) => a.t - b.t).pop();
  if (t17 && t17.type === "arrive" && t17.at === "ship") ev.push(mk("standby", "T17", t17.t + 4*M));
  // a sync from the gangway two hours ago
  const syncT = now - 120*M;
  const before = compute(out.days[id], ev.filter(e => e.t < syncT));
  ev.push(mk("sync", null, syncT, {value: Math.max(0, before.ashore + 7)}));
  out.events[id] = ev;

  const iss = (unit, t, category, text, status, resolution) => { const x = {id:"i" + uid() + ri(0,999), unitName:unit, t, category, text, status, resolvedAt: status === "resolved" ? t + 95*M : null, resolution: resolution || "", port:""}; out.issues[x.id] = x; };
  iss("T15", now - 75*M, "Steering", "Slight play at the helm wheel, driver reports delayed response to starboard. Keep in service, monitor.", "open");
  iss("T14", pStart + 200*M, "Engine", "Port engine high coolant temp alarm on approach to the pier.", "resolved", "Sea water strainer cleared by tender mechanic, alarm reset, tested OK.");
  iss("T11", pStart + 320*M, "Release hooks / falls", "Hook release indicator lamp flickering after hoisting.", "resolved", "Loose connector at indicator panel, re-seated.");
  iss("T14", now - 30 * 864e5, "Engine", "Port engine high coolant temp alarm, same as before.", "resolved", "Strainer cleaned.");
  return out;
}

function summaryOf(st){
  return {tripsOut:st.tripsOut, tripsBack:st.tripsBack, paxOut:st.paxOut, paxBack:st.paxBack, firstLowered:st.firstLowered, lastHoisted:st.lastHoisted, cycleAvg: st.cycleAvg != null ? Math.round(st.cycleAvg) : null, ashoreEnd:st.ashore,
    units: st.list.filter(u => u.tripsOut || u.lowered || u.kind === "shore").map(u => ({name:u.name, trips:u.tripsOut + u.tripsBack, lowered:u.lowered, hoisted:u.hoisted}))};
}

/* ---------------- app state ---------------- */
const S = {
  store:null, role:null, data:{days:[], currentDay:null, events:[], issues:[]},
  view:"board", logUnit:"all", issueUnit:"all", issueStatus:"all",
  hist:null, histEvents:null, undoArm:null, demoRole:"admin"
};
const isAdmin = () => S.role === "admin";
let ST = null; // computed state of current day

function setData(d){ S.data = d; ST = d.currentDay ? compute(d.currentDay, d.events) : null; render(); }

/* ---------------- rendering ---------------- */
function render(){
  const app = $("#app");
  if (!S.role){ app.innerHTML = loginHTML(); bindLogin(); return; }
  const v = S.view;
  let body = "";
  if (v === "board") body = boardHTML();
  else if (v === "log") body = logHTML();
  else if (v === "issues") body = issuesHTML();
  else if (v === "history") body = historyHTML();
  app.innerHTML = headerHTML() + `<main class="wrap">${body}</main>`;
}

function headerHTML(){
  const d = S.data;
  const conn = S.store.mode === "demo" ? `<span class="chip"><span class="dot"></span>This device</span>`
    : d.offline ? `<span class="chip off" title="Changes are saved on this device and will sync when back online"><span class="dot"></span>Offline${d.pending ? " · pending" : ""}</span>`
    : `<span class="chip"><span class="dot"></span>Live</span>`;
  const tab = (id, label) => `<a href="#${id}" ${S.view === id ? 'aria-current="page"' : ""}>${label}</a>`;
  const openIssues = d.issues.filter(i => i.status === "open").length;
  const demo = S.store.mode === "demo" ? `<div class="demo"><div class="wrap"><span><b>Demo mode</b> · sample data, saved on this device only. Connect Firebase to share live between devices.</span>
    <span class="seg" role="group" aria-label="View as"><button data-act="demo-role" data-r="admin" aria-pressed="${S.role === "admin"}">Bridge</button><button data-act="demo-role" data-r="viewer" aria-pressed="${S.role === "viewer"}">Crew View</button></span>
    <button class="linkish" data-act="demo-reset">Reset sample</button></div></div>` : "";
  return `<header class="top"><div class="wrap">
    <div class="brand">${boatSVG(false)}<div><b>Tender Board</b><span>${esc(CONFIG.shipName)}</span></div></div>
    <nav class="tabs">${tab("board","Board")}${tab("log","Log")}${tab("issues","Issues" + (openIssues ? " · " + openIssues : ""))}${tab("history","History")}</nav>
    <div class="who">${conn}<span class="chip role">${isAdmin() ? "Bridge" : "Crew View"}</span>
      <button class="icon-btn" data-act="theme" title="Switch light / dark" aria-label="Switch light or dark theme">${themeLabel()}</button>
      ${S.store.mode === "live" ? `<button class="icon-btn" data-act="signout">Sign out</button>` : ""}</div>
  </div></header>${demo}`;
}

function noDayHTML(){
  return `<div class="emptystate">${boatSVG(false)}<h2>No tender operation open</h2>
    <p>${isAdmin() ? "Open a tender day to start logging lowering times, trips and passengers. Tenders you lower will appear on the board." : "The board fills in as soon as the Bridge opens today's tender operation."}</p>
    ${isAdmin() ? `<button class="btn primary" data-act="open-day">Open tender day</button>` : ""}</div>`;
}

function boardHTML(){
  const day = S.data.currentDay;
  if (!day) return noDayHTML();
  const st = ST, now = Date.now(), est = estimate(day, st, now);
  const lastEv = lastEvent();
  const undoLabel = S.undoArm && lastEv && S.undoArm === lastEv.e.id ? `Tap to confirm: undo “${esc(lastEv.unitName)} ${esc(shortText(lastEv))}”` : "Undo last";
  const syncs = st.log.filter(l => l.e.type === "sync");
  const lastSync = syncs.length ? syncs[syncs.length - 1] : null;

  const recov = recovHTML(day, st, est);
  const deck = `<section class="deck" aria-label="People count">
    <div class="kpi"><div class="lab">Total <small>reference</small></div><div class="val">${num(st.total)}</div><div class="foot">Guests + crew at start</div></div>
    <div class="kpi ashore"><div class="lab">Ashore</div><div class="val">${num(st.ashore)}</div>
      <div class="foot">${lastSync ? `Synced ${fmtT(lastSync.e.t)} · then tender count` : "From tender count"}</div>
      ${isAdmin() ? `<button class="btn small sync" data-act="sync">Sync Ashore</button>` : ""}</div>
    <div class="kpi"><div class="lab">On Tenders</div><div class="val">${num(st.onTenders)}</div><div class="foot">${st.list.filter(u => u.loc === "transit").length} underway</div></div>
    <div class="kpi"><div class="lab">Aboard <small>calculated</small></div><div class="val">${num(st.aboard)}</div><div class="foot">Total − ashore − on tenders</div></div>
    ${recov}</section>`;

  const lanes = LANES.map(l => {
    const us = st.list.filter(u => u.active && u.loc === l.loc);
    return `<div class="lane ${l.loc}"><header>${LANE_ICONS[l.loc]}${l.name}<span class="n">${us.length}</span></header>
      <div class="cards">${us.length ? us.map(cardHTML).join("") : `<div class="empty">No tenders</div>`}</div></div>`;
  }).join("");

  const stowed = st.list.filter(u => !u.active);
  const rack = `<section class="rack"><h2>Stowed · Not in service <small>Lower a tender to put it on the board</small>
      ${isAdmin() ? `<button class="btn small" data-act="add-shore" style="margin-left:auto">+ Shoretender</button>` : ""}</h2>
    <div class="items">${stowed.length ? stowed.map(u => `<div class="stow">${boatSVG(false, "muted" + (u.kind === "shore" ? " shore" : ""))}
      <div class="txt"><b>${esc(u.name)} <span class="side ${u.side}">${u.side}</span></b><span>${u.kind === "shore" ? "Released" : "Stowed"}${u.hoisted ? " · hoisted " + fmtT(u.hoisted) : u.kind === "tender" ? " · embarkation deck" : ""}</span></div>
      ${isAdmin() ? `<button class="btn small" data-act="activate" data-u="${u.id}">${u.kind === "tender" ? "Lower" : "Return"}</button>` : ""}</div>`).join("") : `<div class="stow"><div class="txt"><span>All tenders are in the water.</span></div></div>`}</div></section>`;

  return `<section class="daybar"><div><h1>${esc(day.port || "Tender day")}</h1>
      <div class="sub">${fmtDate(day.date)} · Last tender <span class="mono">${esc(day.lastTender || "—")}</span></div></div>
      <div class="spacer"></div>
      ${isAdmin() ? `<div class="acts"><button class="btn ${S.undoArm ? "arm" : ""}" data-act="undo" ${lastEv ? "" : "disabled"}>${undoLabel}</button><button class="btn" data-act="edit-day">Edit day</button></div>` : ""}
    </section>${deck}<section class="board" aria-label="Tender board">${lanes}</section>${rack}`;
}

function recovHTML(day, st, est){
  let verdict = "";
  if (!est.activeCount) verdict = `<span class="pill">No tenders in service</span>`;
  else if (!est.avgCap) verdict = `<span class="pill warn">Set a max load on the tenders to estimate</span>`;
  else if (est.A === 0) verdict = `<span class="pill ok">Nobody ashore · all ${est.activeCount} recoverable</span>`;
  else {
    verdict = `<span class="pill ${est.needed >= est.activeCount ? "warn" : "ok"}">Need ${est.needed} of ${est.activeCount} in service</span>`;
    if (est.recoverable > 0) verdict += `<span class="pill ok">${est.recoverable} can be recovered</span>`;
    if (est.remain != null && est.remain <= 0) verdict += `<span class="pill crit">Past last tender time</span>`;
    else if (est.perUnit != null && est.needed >= est.activeCount && est.trips > est.activeCount * est.perUnit) verdict += `<span class="pill crit">Not enough round trips left</span>`;
  }
  const line = est.avgCap && est.A > 0
    ? `<b>${num(est.A)}</b> ashore at ~${Math.round(est.avgCap)} per trip = <b>${est.trips} trip${est.trips === 1 ? "" : "s"}</b>${est.perUnit ? ` · each tender can make ${est.perUnit} more` : ""}.`
    : "Live estimate of how many tenders the remaining guests need.";
  return `<div class="recov"><div class="lab"><span>Recovery estimate</span><span class="mono" style="letter-spacing:0">${est.remain != null ? (est.remain > 0 ? "Last tender in " + fmtDur(est.remain) : "Last tender " + esc(day.lastTender)) : "Set last tender time"}</span></div>
    <div class="line">${line}</div>
    <div class="stats"><div><span>Round trip</span><b>${Math.round(est.cycle)} min</b><span>${est.cycleSrc}</span></div>
      <div><span>Trips needed</span><b>${est.trips ?? "—"}</b></div>
      <div><span>Tenders needed</span><b>${est.needed ?? "—"}</b></div>
      <div><span>Recoverable</span><b>${est.recoverable ?? "—"}</b></div></div>
    <div class="verdict">${verdict}</div></div>`;
}

function cardHTML(u){
  const now = Date.now();
  const openIs = S.data.issues.filter(i => i.status === "open" && i.unitName === u.name).length;
  const flip = u.loc === "transit" && u.dir === "ship";
  const since = u.since ? `${fmtT(u.since)} · ${fmtDur((now - u.since) / 60000)}` : "";
  let status = "";
  if (u.loc === "transit") status = `<span class="dir">${u.dir === "shore" ? "→ To shore" : "← To ship"}</span>`;
  let acts = "";
  if (isAdmin()){
    const B = (act, label, cls="") => `<button class="btn small ${cls}" data-act="${act}" data-u="${u.id}">${label}</button>`;
    if (u.loc === "ship") acts = B("depart-shore", "Depart → Shore", "primary") + B("standby", "Stand-by");
    else if (u.loc === "standby") acts = B("alongside-ship", "Alongside Ship") + B("alongside-shore", "Alongside Shore");
    else if (u.loc === "transit") acts = u.dir === "shore" ? B("arrive-shore", "Arrived Shore", "dark") : B("arrive-ship", "Arrived Ship", "dark");
    else if (u.loc === "shore") acts = B("depart-ship", "Depart → Ship", "primary") + B("standby", "Stand-by");
  }
  return `<article class="card" aria-label="${esc(u.name)}">
    <div class="row1"><span class="tname">${esc(u.name)}</span><span class="side ${u.side}">${u.side}</span>${status}
      ${isAdmin() ? `<button class="icon-btn more" data-act="menu" data-u="${u.id}" aria-label="More options for ${esc(u.name)}">•••</button>` : ""}</div>
    <div class="vis">${ringSVG(u.pax, u.cap)}${boatSVG(flip, u.kind === "shore" ? "shore" : "")}</div>
    <div class="meta"><span>Driver <b>${esc(u.driver || "—")}</b></span><span class="mono">${since}</span></div>
    ${u.kind === "tender" && u.lowered ? `<div class="meta"><span>In water since <b class="mono">${fmtT(u.lowered)}</b></span><span>${u.tripsOut} out · ${u.tripsBack} back</span></div>` : `<div class="meta"><span>${u.tripsOut} out · ${u.tripsBack} back</span></div>`}
    ${openIs ? `<div class="flag">⚠ ${openIs} open issue${openIs > 1 ? "s" : ""} · <a href="#issues" data-act="issues-for" data-n="${esc(u.name)}">view</a></div>` : ""}
    ${acts ? `<div class="acts">${acts}</div>` : ""}</article>`;
}

function shortText(l){ return (l.text || "").split(" · ")[0]; }
function lastEvent(){ if (!ST || !ST.log.length) return null; const byCreated = ST.log.slice().sort((a,b) => (b.e.c || 0) - (a.e.c || 0)); return byCreated[0]; }

function logRows(st, opts){
  const rows = st.log.filter(l => opts.unit === "all" || l.unitName === opts.unit).slice().reverse();
  if (!rows.length) return `<tr><td colspan="6" style="color:var(--muted)">Nothing logged yet.</td></tr>`;
  return rows.map(l => `<tr class="k-${l.kind}"><td class="t">${fmtT(l.e.t)}</td><td class="u">${esc(l.unitName)}</td><td>${esc(l.text)}</td>
    <td class="num">${l.pax != null ? l.pax : ""}</td><td>${esc(l.driver || "")}</td>
    ${opts.edit ? `<td class="ra"><button class="btn small" data-act="edit-ev" data-id="${l.e.id}">Edit</button></td>` : ""}</tr>`).join("");
}

function logHTML(){
  const day = S.data.currentDay;
  if (!day) return noDayHTML();
  const st = ST;
  const names = st.list.filter(u => u.tripsOut || u.lowered || u.active || u.kind === "shore").map(u => u.name);
  return `<section class="panel"><div class="panel-head"><h2>${esc(day.port)} · Today’s log</h2>
      <div class="filters"><select class="f" id="logUnit" data-act="log-unit" aria-label="Filter by unit"><option value="all">All units</option>${names.map(n => `<option ${S.logUnit === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <button class="btn" data-act="csv">Export CSV</button>${isAdmin() ? `<button class="btn danger" data-act="close-day">Close day</button>` : ""}</div></div>
    <div class="sumgrid">${sumTiles(summaryOf(st))}</div>
    <div class="tablebox"><table><thead><tr><th>Time</th><th>Unit</th><th>Event</th><th style="text-align:right">Pax</th><th>Driver</th>${isAdmin() ? "<th></th>" : ""}</tr></thead>
    <tbody>${logRows(st, {unit:S.logUnit, edit:isAdmin()})}</tbody></table></div></section>`;
}

function sumTiles(s){
  return `<div><span>Trips to shore</span><b>${s.tripsOut}</b></div><div><span>Pax to shore</span><b>${num(s.paxOut)}</b></div>
    <div><span>Trips to ship</span><b>${s.tripsBack}</b></div><div><span>Pax back</span><b>${num(s.paxBack)}</b></div>
    <div><span>First lowered</span><b class="mono">${fmtT(s.firstLowered)}</b></div><div><span>Last hoisted</span><b class="mono">${fmtT(s.lastHoisted)}</b></div>
    <div><span>Avg round trip</span><b>${s.cycleAvg != null ? s.cycleAvg + " min" : "—"}</b></div>`;
}

function issueUnits(){
  const set = new Set(TENDERS.map(t => "T" + t.num));
  if (ST) ST.list.filter(u => u.kind === "shore").forEach(u => set.add(u.name));
  S.data.issues.forEach(i => set.add(i.unitName));
  return [...set];
}

function issuesHTML(){
  const all = S.data.issues;
  const list = all.filter(i => (S.issueUnit === "all" || i.unitName === S.issueUnit) && (S.issueStatus === "all" || i.status === S.issueStatus));
  const units = issueUnits();
  return `<section class="panel"><div class="panel-head"><h2>Tender issues</h2>
      <div class="filters">
        <select class="f" id="issueUnit" data-act="issue-unit" aria-label="Filter by unit"><option value="all">All units</option>${units.map(n => `<option ${S.issueUnit === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
        <select class="f" id="issueStatus" data-act="issue-status" aria-label="Filter by status">${[["all","Open + resolved"],["open","Open"],["resolved","Resolved"]].map(([v,l]) => `<option value="${v}" ${S.issueStatus === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${isAdmin() ? `<button class="btn primary" data-act="new-issue">Report issue</button>` : ""}</div></div>
    <div class="issues">${list.length ? list.map(i => {
      const repeat = all.filter(x => x.unitName === i.unitName && x.category === i.category && x.id !== i.id && x.t < i.t).length;
      return `<div class="issue"><div class="who2">${esc(i.unitName)}</div>
      <div class="body"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cat">${esc(i.category)}</span><span class="status ${i.status}">${i.status}</span>${repeat ? `<span class="pill warn" style="font-size:11.5px;padding:2px 8px">Seen ${repeat}× before on ${esc(i.unitName)}</span>` : ""}</div>
        <p>${esc(i.text)}</p><span class="when mono">${new Date(i.t).toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"})} · ${fmtT(i.t)}${i.port ? " · " + esc(i.port) : ""}</span>
        ${i.status === "resolved" && (i.resolution || i.resolvedAt) ? `<div class="res">${i.resolvedAt ? `<span class="mono">${fmtT(i.resolvedAt)}</span> ` : ""}${esc(i.resolution || "Resolved")}</div>` : ""}</div>
      ${isAdmin() ? `<div class="side-acts">${i.status === "open" ? `<button class="btn small" data-act="resolve" data-id="${i.id}">Resolve</button>` : `<button class="btn small" data-act="reopen" data-id="${i.id}">Reopen</button>`}<button class="btn small" data-act="edit-issue" data-id="${i.id}">Edit</button></div>` : ""}</div>`;
    }).join("") : `<div class="emptystate" style="padding:24px"><p>No issues match this filter.</p></div>`}</div></section>`;
}

function historyHTML(){
  if (S.hist){
    const d = S.data.days.find(x => x.id === S.hist);
    if (!d){ S.hist = null; return historyHTML(); }
    if (!S.histEvents) return `<section class="panel"><p>Loading…</p></section>`;
    const st = compute(d, S.histEvents);
    return `<section class="panel"><div class="panel-head"><button class="btn" data-act="hist-back">← All days</button><h2>${esc(d.port)} · ${fmtDate(d.date)}</h2>
      <span class="status ${d.status === "open" ? "open" : "resolved"}">${d.status === "open" ? "In progress" : "Closed"}</span><button class="btn" data-act="csv-hist">Export CSV</button></div>
      <div class="sumgrid">${sumTiles(summaryOf(st))}<div><span>Total (ref)</span><b>${num(d.total)}</b></div></div>
      <div class="tablebox"><table><thead><tr><th>Time</th><th>Unit</th><th>Event</th><th style="text-align:right">Pax</th><th>Driver</th></tr></thead><tbody>${logRows(st, {unit:"all", edit:false})}</tbody></table></div></section>`;
  }
  const days = S.data.days;
  return `<section class="panel"><div class="panel-head"><h2>Tender days</h2></div>
    ${days.length ? `<div class="days">${days.map(d => { const s = d.summary || {}; return `<button class="dayc" data-act="hist-open" data-id="${d.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(d.port)}</b><span class="status ${d.status === "open" ? "open" : "resolved"}">${d.status === "open" ? "Today" : "Closed"}</span></div>
      <span class="d">${fmtDate(d.date)} · last tender ${esc(d.lastTender || "—")}</span>
      <div class="g"><div><span>Trips</span><i>${s.tripsOut != null ? s.tripsOut + s.tripsBack : "—"}</i></div><div><span>Pax ashore</span><i>${s.paxOut != null ? num(s.paxOut) : "—"}</i></div><div><span>Round trip</span><i>${s.cycleAvg != null ? s.cycleAvg + "′" : "—"}</i></div></div></button>`; }).join("")}</div>`
      : `<p style="color:var(--muted);margin:0">Closed tender days appear here.</p>`}</section>`;
}

function loginHTML(){
  return `<div class="wrap login"><form id="loginForm" autocomplete="on">
    <div style="display:flex;gap:10px;align-items:center">${boatSVG(false).replace('class="boat ', 'style="width:70px" class="boat ')}<h1>Tender Board</h1></div>
    <div class="fld"><span>Access</span><select id="lgRole"><option value="bridge">Bridge (edit)</option><option value="view">Crew View (read only)</option></select></div>
    <div class="fld"><span>Password</span><input id="lgPw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lgErr" role="alert"></div>
    <button class="btn primary" type="submit">Sign in</button>
    <span style="font-size:12.5px;color:var(--muted)">${esc(CONFIG.shipName)} · tender operations</span></form></div>`;
}
function bindLogin(){
  const f = $("#loginForm"); if (!f) return;
  f.addEventListener("submit", async ev => {
    ev.preventDefault(); $("#lgErr").textContent = "";
    try { await S.store.signIn($("#lgRole").value, $("#lgPw").value); }
    catch(e){ $("#lgErr").textContent = /password|credential|user/i.test(e.code || e.message) ? "Wrong password for this access." : (e.message || "Sign-in failed"); }
  });
}

/* ---------------- theme ---------------- */
function themeLabel(){ const t = lsGet("tb.theme") || "auto"; return t === "auto" ? "Auto" : t === "dark" ? "Dark" : "Light"; }
function applyTheme(){ const t = lsGet("tb.theme") || "auto"; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); }

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

/* ---------------- modal ---------------- */
function modal({title, body, submit="Save", danger=false, onSubmit, extra="", onOpen}){
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" data-close="1"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <header><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-close="1" aria-label="Close">✕</button></header>
    <div class="mb">${body}</div>
    <footer>${extra}<button type="button" class="btn" data-close="1">Cancel</button>${submit ? `<button type="submit" class="btn ${danger ? "arm" : "primary"}">${esc(submit)}</button>` : ""}</footer></form></div>`;
  const form = root.querySelector("form");
  root.querySelector(".overlay").addEventListener("click", e => { if (e.target.dataset.close) closeModal(); });
  root.querySelectorAll("button[data-close]").forEach(b => b.addEventListener("click", closeModal));
  form.addEventListener("submit", e => { e.preventDefault(); const r = onSubmit && onSubmit(form); if (r !== false) closeModal(); });
  if (onOpen) onOpen(form);
  const first = form.querySelector("input:not([type=hidden]),select,textarea"); if (first) setTimeout(() => first.focus(), 30);
}
function closeModal(){ $("#modal-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const normHM = v => { const d = String(v || "").replace(/\D/g, ""); if (d.length < 3 || d.length > 4) return null; const h = +d.slice(0, d.length - 2), m = +d.slice(-2); return h < 24 && m < 60 ? pad(h) + ":" + pad(m) : null; };
const hmInput = (id, val, extra="") => `<input id="${id}" class="hm mono" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" autocomplete="off" value="${esc(val)}" ${extra}>`;
const timeField = (id, ms, label="Time (24h)") => `<label class="fld"><span>${label}</span>${hmInput(id, fmtT(ms ?? Date.now()), `data-init="${fmtT(ms ?? Date.now())}"`)}</label>`;
document.addEventListener("focusout", e => { if (e.target.classList && e.target.classList.contains("hm")){ const n = normHM(e.target.value); if (n) e.target.value = n; } });
function readTime(form, id, dayDate, fallback){
  const el = form.querySelector("#" + id); if (!el) return fallback ?? Date.now();
  const v = normHM(el.value);
  if (!v || v === el.dataset.init) return fallback ?? Date.now();
  const base = dayDate || ymd(Date.now());
  return hmToMs(base, v) ?? Date.now();
}
const driverList = () => `<datalist id="drvList">${(ST ? ST.drivers : []).map(d => `<option value="${esc(d)}">`).join("")}</datalist>`;

/* ---------------- actions ---------------- */
const day = () => S.data.currentDay;
function addEv(type, unit, extra, t){
  const e = Object.assign({id:"e" + uid(), c:seq(), type, unit:unit || null, t: t ?? Date.now()}, extra || {});
  S.undoArm = null;
  return S.store.addEvent(day().id, e);
}

function departModal(u, dir){
  const isShore = dir === "shore";
  const st = ST;
  const maxHint = isShore ? "" : `<span class="hint">${num(Math.max(0, st.ashore))} currently ashore</span>`;
  modal({
    title: `${u.name} · Depart → ${isShore ? "Shore" : "Ship"}`, submit: "Log departure",
    body: `<div class="paxprev" id="pv">${ringSVG(0, u.cap, 96)}</div>
      <label class="fld"><span>Pax on board</span><input id="mPax" class="big" type="number" inputmode="numeric" min="0" step="1" placeholder="0" required>${maxHint}</label>
      <div class="quick"><button type="button" class="btn small" data-q="0">Empty</button>${u.cap ? `<button type="button" class="btn small" data-q="${u.cap}">Full · ${u.cap}</button>` : ""}</div>
      <div id="mWarn"></div>
      <div class="two"><label class="fld"><span>Driver</span><input id="mDrv" list="drvList" value="${esc(u.driver)}" autocomplete="off"></label>${timeField("mT")}</div>${driverList()}`,
    onOpen: f => {
      const upd = () => { const p = Math.max(0, parseInt(f.querySelector("#mPax").value || "0", 10) || 0); f.querySelector("#pv").innerHTML = ringSVG(p, u.cap, 96);
        f.querySelector("#mWarn").innerHTML = u.cap && p > u.cap ? `<div class="warnbox">${p} is above the max load of ${u.cap}.</div>` : (!isShore && p > st.ashore ? `<div class="warnbox">More than the ${num(st.ashore)} counted ashore. Check the number or sync Ashore.</div>` : ""); };
      f.querySelector("#mPax").addEventListener("input", upd);
      f.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { f.querySelector("#mPax").value = b.dataset.q; upd(); }));
    },
    onSubmit: f => {
      const v = f.querySelector("#mPax").value;
      if (v === "" || isNaN(+v)){ f.querySelector("#mWarn").innerHTML = `<div class="warnbox">Enter the number of pax (0 if empty).</div>`; return false; }
      const drv = f.querySelector("#mDrv").value.trim();
      addEv("depart", u.id, {dir, pax: Math.max(0, Math.round(+v)), driver: drv}, readTime(f, "mT", day().date));
      toast(`${u.name} departed → ${isShore ? "Shore" : "Ship"} · ${Math.round(+v)} pax`);
    }
  });
}

function activateModal(u){
  const tender = u.kind === "tender";
  modal({
    title: tender ? `Lower ${u.name}` : `Return ${u.name} to service`, submit: tender ? "Log lowering" : "Return to service",
    body: `<p style="margin:0;color:var(--muted)">${tender ? "Logs the lowering time and puts the tender alongside the ship." : "Puts the shoretender back alongside the ship."}</p>
      <div class="two"><label class="fld"><span>Max load (pax)</span><input id="mCap" type="number" inputmode="numeric" min="1" value="${u.cap ?? ""}" required></label>
      <label class="fld"><span>Driver</span><input id="mDrv" list="drvList" value="${esc(u.driver)}" autocomplete="off"></label></div>

    onSubmit: f => {
      const cap = parseInt(f.querySelector("#mCap").value, 10);

function shoreModal(){
  modal({
    title: "Add shoretender", submit: "Add to board",

function menuModal(u){
  const canStow = (u.loc === "ship" || u.loc === "standby") && u.pax === 0;
  modal({
    title: `${u.name} options`, submit: null,
    body: `<div class="menu-list">
      <button type="button" class="btn" data-m="driver">Change driver</button>
      <button type="button" class="btn" data-m="cap">Set max load (now ${u.cap ?? "—"})</button>
      <button type="button" class="btn" data-m="issue">Report issue</button>
      ${canStow ? `<button type="button" class="btn danger" data-m="stow">${u.kind === "tender" ? "Hoist and stow" : "Release from service"}</button>`
        : `<span class="hint" style="font-size:13px;color:var(--muted)">${u.kind === "tender" ? "Hoist" : "Release"} is available when the tender is alongside the ship or on stand-by and empty.</span>`}</div>`,
    onOpen: f => f.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
      const m = b.dataset.m;
      if (m === "driver") simpleModal(`${u.name} · Driver`, "Driver", "text", u.driver, v => addEv("driver", u.id, {driver: v}), true);

        onSubmit: f2 => { addEv("deactivate", u.id, {}, readTime(f2, "mT", day().date)); toast(`${u.name} ${u.kind === "tender" ? "hoisted" : "released"}`); }});

}

      <label class="fld"><span>Planned round trip (min)</span><input id="mCyc" type="number" inputmode="numeric" min="5" value="${esc(d.plannedCycle ?? 30)}"><span class="hint">Used for the estimate until real round trips are logged.</span></label><div id="mWarn"></div>`,

function editEvModal(id){
  const l = ST.log.find(x => x.e.id === id); if (!l) return;
  const e = l.e;
  const hasPax = e.type === "depart", hasDrv = e.type === "depart" || e.type === "activate" || e.type === "driver";
  const hasCap = e.type === "cap" || e.type === "activate" || e.type === "shore_add", hasVal = e.type === "sync";
  modal({title:`Edit · ${l.unitName} · ${shortText(l)}`, submit:"Save",
    extra:`<button type="button" class="btn danger" id="mDel" style="margin-right:auto">Delete</button>`,
    body: `${timeField("mT", e.t)}
      ${hasPax ? `<label class="fld"><span>Pax</span><input id="mPax" type="number" inputmode="numeric" min="0" value="${e.pax ?? 0}"></label>` : ""}
      ${hasVal ? `<label class="fld"><span>Ashore value</span><input id="mVal" type="number" inputmode="numeric" min="0" value="${e.value ?? 0}"></label>` : ""}
      ${hasCap ? `<label class="fld"><span>Max load</span><input id="mCap" type="number" inputmode="numeric" min="1" value="${e.cap ?? ""}"></label>` : ""}
      ${hasDrv ? `<label class="fld"><span>Driver</span><input id="mDrv" list="drvList" value="${esc(e.driver || "")}"></label>${driverList()}` : ""}
      <span class="hint" style="font-size:12.5px;color:var(--muted)">Counts are recalculated from the corrected log.</span>`,
    onOpen: f => { const b = f.querySelector("#mDel"); b.addEventListener("click", () => {
      if (b.dataset.armed){ S.store.deleteEvent(day().id, e.id); closeModal(); toast("Entry deleted"); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; b.classList.add("arm"); } }); },
    onSubmit: f => {
      const p = {t: readTime(f, "mT", ymd(e.t), e.t)};
      if (hasPax) p.pax = Math.max(0, parseInt(f.querySelector("#mPax").value, 10) || 0);
      if (hasVal) p.value = Math.max(0, parseInt(f.querySelector("#mVal").value, 10) || 0);
      if (hasCap){ const c = parseInt(f.querySelector("#mCap").value, 10); if (c) p.cap = c; }
      if (hasDrv) p.driver = f.querySelector("#mDrv").value.trim();
      S.store.updateEvent(day().id, e.id, p); toast("Entry corrected");
    }});
}

function issueModal(existing, unitName){

      <label class="fld"><span>Category</span><select id="mCat">${CATEGORIES.map(c => `<option ${i.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label></div>
      <div class="two"><label class="fld"><span>Date</span><input id="mD" type="date" value="${ymd(t)}"></label><label class="fld"><span>Time (24h)</span>${hmInput("mTi", fmtT(t))}</label></div>

function resolveModal(i){
  modal({title:`Resolve · ${i.unitName}`, submit:"Mark resolved",
    body: `<p style="margin:0">${esc(i.text)}</p><label class="fld"><span>What was done</span><textarea id="mRes" placeholder="e.g. Strainer cleaned, tested OK"></textarea></label>
      <div class="two"><label class="fld"><span>Date</span><input id="mD" type="date" value="${ymd(Date.now())}"></label><label class="fld"><span>Time (24h)</span>${hmInput("mTi", fmtT(Date.now()))}</label></div>`,
    onSubmit: f => { S.store.saveIssue({id:i.id, status:"resolved", resolution: f.querySelector("#mRes").value.trim(), resolvedAt: hmToMs(f.querySelector("#mD").value, normHM(f.querySelector("#mTi").value)) ?? Date.now()}); toast("Issue resolved"); }});

function csvFor(d, st){
  const rows = [["Date","Port","Time","Unit","Event","Pax","Driver"]];
  st.log.forEach(l => rows.push([d.date, d.port, fmtT(l.e.t), l.unitName, l.text, l.pax ?? "", l.driver || ""]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type:"text/csv"}));
  a.download = `tender-log_${d.date}_${(d.port || "port").replace(/\W+/g, "-")}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------------- event wiring ---------------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !$("#app").contains(el)) return;
  const act = el.dataset.act, u = el.dataset.u && ST ? ST.units[el.dataset.u] : null;
  switch (act){
    case "theme": { const cur = lsGet("tb.theme") || "auto"; lsSet("tb.theme", cur === "auto" ? "dark" : cur === "dark" ? "light" : "auto"); applyTheme(); render(); break; }
    case "signout": S.store.signOut(); break;
    case "demo-role": S.role = el.dataset.r; S.demoRole = el.dataset.r; render(); break;
    case "demo-reset": S.store.reset(); toast("Sample data reloaded"); break;
    case "open-day": dayModal(null); break;
    case "edit-day": dayModal(day()); break;
    case "sync": syncModal(); break;
    case "undo": {
      const l = lastEvent(); if (!l) break;
      if (S.undoArm === l.e.id){ S.undoArm = null; S.store.deleteEvent(day().id, l.e.id); toast(`Undone: ${l.unitName} ${shortText(l)}`); }
      else { S.undoArm = l.e.id; render(); setTimeout(() => { if (S.undoArm === l.e.id){ S.undoArm = null; render(); } }, 5000); }
      break;
    }
    case "depart-shore": departModal(u, "shore"); break;
    case "depart-ship": departModal(u, "ship"); break;
    case "arrive-shore": addEv("arrive", u.id, {at:"shore"}); toast(`${u.name} alongside Shore · ${u.pax} landed`); break;
    case "arrive-ship": addEv("arrive", u.id, {at:"ship"}); toast(`${u.name} alongside Ship · ${u.pax} back on board`); break;
    case "standby": addEv("standby", u.id); toast(`${u.name} on stand-by`); break;
    case "alongside-ship": addEv("alongside", u.id, {at:"ship"}); break;
    case "alongside-shore": addEv("alongside", u.id, {at:"shore"}); break;
    case "activate": activateModal(u); break;
    case "add-shore": shoreModal(); break;
    case "menu": menuModal(u); break;
    case "csv": csvFor(day(), ST); break;
    case "close-day": closeDayModal(); break;
    case "edit-ev": editEvModal(el.dataset.id); break;
    case "new-issue": issueModal(null, S.issueUnit !== "all" ? S.issueUnit : null); break;
    case "resolve": { const i = S.data.issues.find(x => x.id === el.dataset.id); if (i) resolveModal(i); break; }
    case "reopen": S.store.saveIssue({id: el.dataset.id, status:"open", resolvedAt:null}); toast("Issue reopened"); break;
    case "edit-issue": { const i = S.data.issues.find(x => x.id === el.dataset.id); if (i) issueModal(i); break; }
    case "issues-for": S.issueUnit = el.dataset.n; S.issueStatus = "all"; break;
    case "hist-open": openHist(el.dataset.id); break;
    case "hist-back": S.hist = null; S.histEvents = null; render(); break;
    case "csv-hist": { const d = S.data.days.find(x => x.id === S.hist); if (d && S.histEvents) csvFor(d, compute(d, S.histEvents)); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.act) return;
  if (el.dataset.act === "log-unit"){ S.logUnit = el.value; render(); }
  if (el.dataset.act === "issue-unit"){ S.issueUnit = el.value; render(); }
  if (el.dataset.act === "issue-status"){ S.issueStatus = el.value; render(); }
});
async function openHist(id){
  S.hist = id; S.histEvents = null; render();
  const d = S.data.days.find(x => x.id === id);
  S.histEvents = d && d.status === "open" && S.data.currentDay && S.data.currentDay.id === id ? S.data.events : await S.store.getEvents(id);
  render();
}
function route(){
  const h = (location.hash || "").replace("#", "");
  S.view = ["board","log","issues","history"].includes(h) ? h : "board";
  if (S.view !== "history"){ S.hist = null; S.histEvents = null; }
  render(); window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
setInterval(() => { if (S.role && !$("#modal-root").innerHTML && (S.view === "board")) render(); }, 30000);

/* ---------------- boot ---------------- */
(async function boot(){
  applyTheme();
  const h = (location.hash || "").replace("#", "");
  S.view = ["board","log","issues","history"].includes(h) ? h : "board";
  if (CONFIG.firebase){
    $("#app").innerHTML = `<div class="wrap login"><p>Connecting…</p></div>`;
    try { S.store = await createFirebaseStore(); }
    catch(e){ $("#app").innerHTML = `<div class="wrap login"><div class="emptystate"><h2>Cannot reach the server</h2><p>${esc(e.message)}. Check the ship’s internet connection and reload.</p></div></div>`; return; }
    S.store.onChange(setData);
    S.store.onAuth(user => {
      S.role = user ? (user.email === CONFIG.accounts.bridge ? "admin" : "viewer") : null;
      if (!user){ S.data = {days:[], currentDay:null, events:[], issues:[]}; ST = null; }
      render();
    });
  } else {
    S.store = createLocalStore();
    S.role = "admin";
    S.store.seedIfEmpty();
    S.store.onChange(setData);
  }
})();
</script>

</body>
