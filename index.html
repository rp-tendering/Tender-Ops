<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13212f">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tendering Ops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tendering Operations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: compact status strip + pontoon line, then the board as a grid like the bridge whiteboard:
   one row per boat (numeric), columns SHIP | IN TRANSIT | SHORE, the boat token sits in its column. */
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f3f5f8; --ink:#13212f; --muted:#5a6b7d; --line:#d3dbe4;
  --accent:#e4570f; --accent-ink:#ffffff; --accent-soft:#fde8dc;
  --sea:#1f6391; --sea-tint:#e3eef6; --hull:#fbfcfd; --fender:#1d2329; --glass:#1b2733;
  --ok:#2b8a3e; --warn:#d97706; --crit:#d63031; --track:#e2e7ed; --off:#eceff3;
  --stbd:#1f9d55; --port:#d63031; --dk:#1f6391; --ht:#7c4dcc; --tc:#b26a00;
  --shadow:0 1px 2px rgba(19,33,47,.06),0 2px 8px rgba(19,33,47,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a141e; --surface:#112131; --surface-2:#0d1a27; --ink:#e4ecf3; --muted:#8ea3b7; --line:#22374b;
    --accent:#ff7a33; --accent-ink:#1a0d04; --accent-soft:#3a2214;
    --sea:#5aaee0; --sea-tint:#0f2638; --hull:#dfe7ee; --fender:#05080b; --glass:#0b1117;
    --ok:#51cf66; --warn:#fcc419; --crit:#ff6b6b; --track:#1d3245; --off:#0c1621;
    --stbd:#51cf66; --port:#ff6b6b; --dk:#2f7fb5; --ht:#8f63dd; --tc:#c17a10; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a141e; --surface:#112131; --surface-2:#0d1a27; --ink:#e4ecf3; --muted:#8ea3b7; --line:#22374b;
  --accent:#ff7a33; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --sea:#5aaee0; --sea-tint:#0f2638; --hull:#dfe7ee; --fender:#05080b; --glass:#0b1117;
  --ok:#51cf66; --warn:#fcc419; --crit:#ff6b6b; --track:#1d3245; --off:#0c1621;
  --stbd:#51cf66; --port:#ff6b6b; --dk:#2f7fb5; --ht:#8f63dd; --tc:#c17a10; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sn{display:none}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px 14px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:56px;height:22px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:5px 12px;border-radius:6px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--warn)}
.chip.role{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 8px;cursor:pointer;font-size:13px;font-weight:600}
.icon-btn:hover{background:var(--surface-2)}
.demo{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkish{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

main{padding-block:12px 70px;display:flex;flex-direction:column;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.1;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.arm{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.small{min-height:30px;padding:5px 10px;font-size:13px}
.btn.big{min-height:46px;font-size:16px}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* day line */
.dayline{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.dayline h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;line-height:1}
.dayline .sub{color:var(--muted);font-size:14px}
.dayline .sub b{color:var(--ink);font-weight:600}
.dayline .spacer{flex:1}
.dinfo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dinfo > span{font-size:13.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;white-space:nowrap;color:var(--muted)}
.dinfo b{color:var(--ink);font-weight:700}
.dinfo .chn{background:var(--ink);color:color-mix(in srgb,var(--surface) 75%,transparent);border-color:var(--ink)}
.dinfo .chn b{color:var(--surface)}
.dayline .btn{align-self:center}

/* status panel: people | pontoons | recovery */
.deck{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1.15fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec{min-width:0;border-left:1px solid var(--line)}
.sec:first-child{border-left:0}
.sh{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);min-height:26px}
.sh .btn{margin-left:auto;font-family:var(--f-body);letter-spacing:0;text-transform:none;min-height:26px;padding:3px 10px}
.people{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr}
.m{display:flex;flex-direction:column;justify-content:center;padding:9px 14px;border-left:1px solid var(--line);min-width:0}
.m:first-child{border-left:0}
.m .l{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.m .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .q{font-size:11px;color:var(--muted)}
.m.ashore{background:var(--ink);color:var(--surface);flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.m.ashore .l{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.m.ashore .v{color:var(--accent);font-size:34px}
.m.ashore .sync{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--surface) 35%,transparent)}
.m.ashore .sync:hover{background:color-mix(in srgb,var(--surface) 12%,transparent)}
.m .s{font-size:11px;color:color-mix(in srgb,var(--surface) 65%,transparent);white-space:nowrap}
.pont,.rec{padding:8px 14px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:14.5px;padding:2px 0}
.prow i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.prow.occ i{background:var(--accent)} .prow.closed i{background:var(--line)} .prow.sb i{background:var(--warn)}
.prow .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.closed .pn{color:var(--muted)}
.prow b{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
.prow em{font-style:normal;font-size:13px;font-weight:600}
.prow em.free{color:var(--ok)} .prow em.closed{color:var(--muted)}
.phase{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.phase.out{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.phase.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.rec p{margin:0}
.rec .big{font-size:16px;line-height:1.3}
.rec .big b{font-family:var(--f-display);font-size:22px}
.rec.ok .big b{color:var(--ok)} .rec.warn .big b{color:var(--warn)} .rec.crit .big b{color:var(--crit)}
.rec .btn{align-self:flex-start}
.rec .remind{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:8px;padding:5px 9px;font-size:13.5px;font-weight:600}
.rec .lastt,.rec .chk,.rec .done{border-radius:8px;padding:6px 9px;font-size:13.5px}
.rec .lastt{background:var(--ink);color:var(--surface)}
.rec .lastt b{color:var(--accent)}
.rec .chk{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line))}
.rec .done{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));font-weight:600}
.rec .linkish{align-self:flex-start;color:var(--muted);font-size:12.5px}
.otbar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;background:var(--ok);color:#fff;border-radius:12px;padding:10px 16px}
.otbar > b{font-family:var(--f-display);font-size:24px;letter-spacing:.1em;text-transform:uppercase}
.otbar span{font-size:14px;opacity:.95}
.otbar .btn{margin-left:auto;background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.otbtn{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.chip.ot{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.role.d-hotel{background:var(--ht);border-color:var(--ht)} .chip.role.d-tech{background:var(--tc);border-color:var(--tc)}
.badge.warnb{background:var(--crit);color:#fff}
.badge{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;font-size:12px;font-family:var(--f-body);font-weight:700;margin-left:2px}
.chat .panel-head .hint{font-size:13.5px;color:var(--muted)}
.chat .radio{margin:0;font-size:12.5px;color:var(--muted);border-left:3px solid var(--warn);padding-left:8px}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:min(62vh,640px);min-height:240px;overflow-y:auto;padding:4px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.msg{align-self:flex-start;max-width:min(560px,86%);background:var(--surface-2);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:7px 11px;display:flex;flex-direction:column;gap:2px}
.msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--sea) 12%,var(--surface));border-radius:12px 12px 4px 12px}
.msg .mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.msg .nmx{font-size:14px}
.msg .rk{font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)} .msg .mt{margin-left:auto;color:var(--muted);font-size:11.5px}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dept{font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:4px;color:#fff;background:var(--dk)}
.dept.d-hotel{background:var(--ht)} .dept.d-tech{background:var(--tc)}
.msep{align-self:center;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.mlist.hist{max-height:420px;min-height:0}
.bh{margin:6px 0 0;font-family:var(--f-display);font-size:20px}
.mempty{margin:auto;color:var(--muted);font-size:14px;padding:30px 0}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;resize:none;min-height:44px;max-height:140px}
.credit{font-style:italic;letter-spacing:.04em;text-transform:none;opacity:.85}
.lgfoot{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.acct{display:inline-flex;align-items:center;gap:6px}
.themebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;padding:0}
.grow.head .cb{flex-direction:row;align-items:center;gap:8px}
.grow.head .hbtn{width:26px;height:26px;min-width:26px;border-radius:50%;font-size:13px;padding:0}
.capbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13.5px}
.capbar .l{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.capbar b{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.capbar i{font-style:normal;color:var(--muted);margin:0 10px 0 4px}
.capbar .u{color:var(--muted);margin-left:5px;font-size:12.5px}
.capbar > div{display:flex;align-items:baseline;flex-wrap:wrap}
.meter{display:inline-block;width:90px;height:7px;border-radius:4px;background:var(--track);margin-left:10px;overflow:hidden;align-self:center}
.meter span{display:block;height:100%;background:var(--ok)}
.capbar.mid .meter span{background:var(--warn)} .capbar.hi .meter span{background:var(--crit)}
.sug{font-weight:700;font-size:13.5px;padding:4px 11px;border-radius:999px;margin-left:auto;white-space:nowrap}
.sug.up{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.sug.down{background:color-mix(in srgb,var(--sea) 13%,transparent);color:var(--sea);border:1px solid color-mix(in srgb,var(--sea) 40%,var(--line))}
.rec .rl{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.flagl{display:inline-flex;flex-direction:column;font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;max-width:100%}
.flagl em{font-style:normal;font-weight:500;letter-spacing:0;font-size:12px;overflow-wrap:anywhere}
.flagl.f-tech,.flagl.f-pvi{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 75%,var(--ink))}
.flagl.f-emergency{background:var(--crit);color:#fff}
.grow.fl-tech,.grow.fl-pvi{background:color-mix(in srgb,var(--warn) 9%,var(--surface));box-shadow:inset 4px 0 0 var(--warn)}
.grow.fl-emergency{background:color-mix(in srgb,var(--crit) 10%,var(--surface));box-shadow:inset 5px 0 0 var(--crit)}
.embar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;background:var(--crit);color:#fff;border-radius:12px;padding:10px 16px}
.embar > b{font-family:var(--f-display);font-size:24px;letter-spacing:.12em;text-transform:uppercase}
@media (prefers-reduced-motion: no-preference){ .embar{animation:empulse 1.6s ease-in-out infinite} @keyframes empulse{50%{filter:brightness(1.15)}} }
.tok[data-act]{cursor:pointer;border-radius:10px;padding:2px 4px}
.tok[data-act]:hover{background:color-mix(in srgb,var(--sea) 8%,transparent)}
.eta.late,.eta.late b{color:var(--warn)}
.xtra{display:flex;flex-direction:column;align-items:center;gap:1px}
.btn.ghost{background:transparent;font-weight:600;color:var(--sea);border-color:color-mix(in srgb,var(--sea) 40%,var(--line))}
.nextb{font-size:11.5px;color:var(--sea);white-space:nowrap}
.nextb b{font-weight:700}
.eta{font-size:11.5px;color:var(--ink);white-space:nowrap}
.eta b{font-weight:700}
.m.svc .svcr{display:flex;align-items:center;gap:6px}
.svcring .c{font-size:11px}
.deck.nrec{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.people{grid-template-columns:1.35fr 1fr 1fr 1fr 1fr}
.stats{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.stats > summary{cursor:pointer;padding:10px 0;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stats[open]{padding-bottom:12px}
.stats .capbar{border:0;padding:0 0 10px;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:10px}
.sugbar{margin:0;align-self:flex-start}
.onlbtn{cursor:pointer}
.onl{display:flex;flex-direction:column;gap:8px}
.onl > div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rk2{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.onl .hint{margin-left:auto}
.offbar{background:var(--warn);color:#1a1200;font-weight:600;font-size:13.5px}
.offbar .wrap{padding-block:6px}
.board.ro .grow{grid-template-columns:minmax(170px,220px) repeat(3,minmax(0,1fr));grid-template-areas:"b s t h"}
.board.ro .grow.off{grid-template-columns:minmax(170px,220px) repeat(3,minmax(0,1fr))}
.board.ro .ca{display:none}
.board.ro .grow.off .offc{grid-column:2 / 5}
.legend{display:flex;flex-direction:column;gap:10px}
.legend h4,.mg{margin:6px 0 0;font-family:var(--f-display);font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}
.lgcols{display:flex;gap:2px}.lgcols i{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 4px;border:1px solid var(--line);background:var(--surface-2)}.lgcols i:nth-child(2){background:var(--sea-tint)}
.lgtime{font-size:12px;color:var(--muted)}
.lgmarks{font-size:12px;font-weight:600}.lgmarks .iss{color:var(--crit)}.lgmarks .nt{color:var(--sea)}

tr.k-last td{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.how{margin:4px 0 0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.how b{font-family:var(--f-display);font-size:16px}
.side{font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 6px;border-radius:5px;border:1.5px solid currentColor;white-space:nowrap;line-height:1.2}

.pchip i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)}

/* board grid */
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grow{display:grid;grid-template-columns:minmax(170px,220px) repeat(3,minmax(0,1fr)) 176px;grid-template-areas:"b s t h a";border-top:1px solid var(--line)}
.grow.head{border-top:0;background:var(--surface-2)}

.grow.head > div{padding:9px 12px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--muted)}
.grow.head svg{width:28px;height:16px;flex:none}
.grow.head .h-t{justify-content:center}
.grow > .cb{grid-area:b} .grow > .cs{grid-area:s} .grow > .ct{grid-area:t} .grow > .ch{grid-area:h} .grow > .ca{grid-area:a}
.cs,.ct,.ch{border-left:1px dashed var(--line);display:flex;align-items:center;justify-content:center;padding:8px 6px;min-height:96px;min-width:0}
.ct{background:var(--sea-tint)}

.cb{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;text-align:left;background:none;border:0;cursor:pointer;color:inherit}
.cb:hover .bn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.bn{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;white-space:nowrap}
.bn .nm{flex:none}
.bn.long{font-size:21px}
.bn.long .nm{white-space:normal;line-height:1.05}
.drv{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv b{color:var(--ink);font-weight:600}
.marks{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:600}
.marks .iss{color:var(--crit)} .marks .nt{color:var(--sea)}
.ca{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:8px 10px;border-left:1px solid var(--line)}
.ca .btn{width:100%}
.ca .wait{font-size:12.5px;color:var(--muted);text-align:center}

.tok{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;max-width:100%}

.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.berth{background:var(--ink);color:var(--surface)}
.tag.sb{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.dir{color:var(--sea);font-family:var(--f-display);font-size:13px;letter-spacing:.06em;padding:0}
.tok .since{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ring{flex:none}
.ring .trk{fill:none;stroke:var(--track);stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease,stroke .3s}
.ring.ok .val{stroke:var(--ok)} .ring.warn .val{stroke:var(--warn)} .ring.crit .val{stroke:var(--crit)}
.ring .n{font-family:var(--f-display);font-weight:700;font-size:25px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}

.ring.crit .n{fill:var(--crit)}

.grow.off{background:var(--off)}
.grow.off .cb{opacity:.75}
.grow.off .offc{grid-column:2 / 5;display:flex;align-items:center;gap:14px;padding:8px 14px;border-left:1px dashed var(--line);color:var(--muted);font-size:14px;min-width:0}

.sep{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-top:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* boat drawing */
.boat .hull{fill:var(--hull);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.boat .can{fill:var(--accent);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.boat .stripe{fill:none;stroke:var(--ink);stroke-width:1.2}
.boat .win{fill:var(--glass);stroke:var(--hull);stroke-width:1}
.boat .door{fill:var(--glass);stroke:var(--hull);stroke-width:1}
.boat .fend{fill:var(--fender)}
.boat .post{fill:var(--accent);stroke:var(--ink);stroke-width:.9}
.boat .crease{fill:none;stroke:var(--ink);stroke-width:.6;opacity:.45}
.boat .dome{fill:var(--hull);stroke:var(--ink);stroke-width:.8}
.boat .num{font-family:var(--f-display);font-weight:700;font-size:10px;fill:var(--ink)}
.boat .wave{fill:none;stroke:var(--sea);stroke-width:1.3;stroke-linecap:round}
.boat.shore .can,.boat.shore .post{fill:var(--sea)}
.boat.muted .can,.boat.muted .post{fill:var(--track)}
.boat.muted .wave{stroke:var(--line)}
.boat.muted .win,.boat.muted .door{fill:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .ct .boat .hullg{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 45px}
  @keyframes bob{50%{transform:translateY(1.2px) rotate(-.5deg)}}
}

/* pages */

tr.k-sync td,tr.k-pont td{background:color-mix(in srgb,var(--sea) 8%,transparent)}
tr.k-lower td,tr.k-hoist td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sumgrid div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sumgrid span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

.issues{display:flex;flex-direction:column;gap:8px}

.status.open{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* login */
.login{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:30px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,14,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border-radius:16px;width:min(480px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal header{padding:14px 16px 4px;display:flex;align-items:center;gap:10px}

.fld{display:flex;flex-direction:column;gap:5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}

.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.choice button:disabled{opacity:.4;cursor:not-allowed}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;min-height:44px;font-size:15px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.kv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ti{display:flex;flex-direction:column;gap:12px}
.ti-hero{--c:var(--sea);display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-left:5px solid var(--c)}
.ti-hero.ti-ship{--c:var(--ok)} .ti-hero.ti-shore{--c:var(--accent)} .ti-hero.ti-sb{--c:var(--muted)} .ti-hero.ti-off{--c:var(--muted)}
.ti-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.ti-pax .ring{width:76px;height:76px}
.ti-pt span{white-space:nowrap}
.ti-pax{display:flex;flex-direction:column;align-items:center;gap:2px} .ti-pax small{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ti-leg{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.ti-pt{display:flex;flex-direction:column;gap:1px} .ti-pt.r{text-align:right;align-items:flex-end}
.ti-pt span,.ti-one span,.ti-pont span,.ti-note span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.ti-pt.r b{color:var(--sea)} .ti-pt.late b,.ti-pt.late small{color:var(--warn)}
.ti-bar{position:relative;height:6px;border-radius:3px;background:var(--track);min-width:60px;margin:0 14px 8px}

.ti-b{position:absolute;bottom:3px;transform:translateX(-50%);display:block;width:48px;line-height:0} .ti-b svg{width:48px;height:auto}
.ti-one,.ti-pont{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ti-one b{font-size:20px} .ti-pont{background:var(--sea-tint);border-color:color-mix(in srgb,var(--sea) 30%,transparent)} .ti-pont b{font-family:var(--f-display);font-size:20px;color:var(--sea)}

.onlc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.onlc .d-deck{--c:var(--dk)} .onlc .d-hotel{--c:var(--ht)} .onlc .d-tech{--c:var(--tc)}
.onlc b{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--c)} .onlc span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kv .wide{grid-column:1/-1}
.kv b{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:9px;padding:8px 10px;font-size:13.5px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}

/* ---------------- core model: replay the event log ---------------- */
function pontoonsOf(day, evs){
  let p = {side: day && day.side || "STBD", FWD: day ? day.fwd !== false : true, MID: day ? day.mid !== false : true};

}
function compute(day, events){
  const units = {}, order = [];
  const mkUnit = (o) => Object.assign({active:false, loc:"stowed", berth:null, dir:null, pax:0, cap:null, driver:"", note:"", since:null, lowered:null, hoisted:null, tripsOut:0, tripsBack:0, paxOut:0, paxBack:0, lastShipDep:null, flag:null, plan:null, tDepShip:null, tArrShore:null, tDepShore:null, tArrShip:null}, o);

        order.push(e.unit); atBerth(u, e.berth || "SB");
        text = `Shoretender on service · ${berthName(u.berth)} · max ${u.cap}`;
        break;
      case "activate":
        Object.assign(u, {active:true, pax:0, since:e.t, lastShipDep:null, flag:null}); atBerth(u, e.berth || "SB"); changes.push(e.t);
        if (e.cap) u.cap = e.cap; if (!u.cap) u.cap = u.kind === "shore" ? SHORE_CAP : DEFAULT_CAP;
        if (e.driver) u.driver = e.driver;

        break;
      case "deactivate":
        Object.assign(u, {active:false, loc:"stowed", berth:null, dir:null, pax:0, since:e.t, lastShipDep:null, flag:null}); changes.push(e.t);

          if (u.tArrShip != null && e.t - u.tArrShip < 90*60000) legs.ship.push((e.t - u.tArrShip)/60000);
          u.tDepShip = e.t;
          u.paxOut += pax; u.tripsOut++;
          if (u.lastShipDep != null) cycles.push({unit:u.id, t:e.t, min:(e.t - u.lastShipDep) / 60000});
          u.lastShipDep = e.t;
          text = `Departed ${u.berth && u.berth !== "SB" ? berthName(u.berth) + " " : ""}→ Shore`;
        } else { if (u.tArrShore != null && e.t - u.tArrShore < 90*60000) legs.pier.push((e.t - u.tArrShore)/60000); u.tDepShore = e.t;
          ashore -= pax; u.paxBack += pax; u.tripsBack++; text = e.last ? "LAST TENDER departed → Ship" : "Departed → Ship";
          if (e.last){ lastDep = {unit:u.id, name:u.name, t:e.t, pax, arrived:null}; kind = "last"; } }

        break;
      }
      case "arrive":
        if (e.at === "shore"){
          if (u.tDepShip != null && e.t - u.tDepShip < 90*60000) legs.tOut.push((e.t - u.tDepShip)/60000); u.tArrShore = e.t;
          pax = u.pax; ashore += u.pax; text = `Alongside Shore · ${u.pax} landed`;
          Object.assign(u, {loc:"shore", berth:null, dir:null, pax:0, since:e.t});
        } else {
          if (u.tDepShore != null && e.t - u.tDepShore < 90*60000) legs.tIn.push((e.t - u.tDepShore)/60000); u.tArrShip = e.t;
          const b = e.berth || "SB"; atBerth(u, b); u.since = e.t; if (b !== "SB") u.plan = null;
          if (b === "SB"){ text = `Stand-by at ship · ${u.pax} waiting on board`; }
          else { pax = u.pax; text = `Alongside ${berthName(b)} · ${u.pax} back on board`; u.pax = 0;
            if (lastDep && lastDep.unit === u.id && !lastDep.arrived) lastDep.arrived = e.t; }
        }
        break;
      case "berth": {
        const b = e.berth;
        if (b !== "SB" && u.pax > 0){ pax = u.pax; text = `Alongside ${berthName(b)} · ${u.pax} back on board`; }
        else text = b === "SB" ? "Moved to stand-by" : `Alongside ${berthName(b)}`;
        atBerth(u, b); u.since = e.t; if (b !== "SB"){ u.plan = null; u.pax = 0; if (lastDep && lastDep.unit === u.id && !lastDep.arrived) lastDep.arrived = e.t; }
        break;
      }
      case "plan": u.plan = e.berth || null; text = e.berth ? `Assigned to ${berthName(e.berth)}` : "Pontoon assignment cleared"; break;
      case "pontoons":
        pont.side = e.side || pont.side; pont.FWD = !!e.fwd; pont.MID = !!e.mid; kind = "pont";
        text = `Pontoons: ${pont.side} · FWD ${pont.FWD ? "open" : "closed"} · MIDSHIP ${pont.MID ? "open" : "closed"}`;
        break;
      case "opentender": openTender = {on: !!e.on, since: e.on ? e.t : null, by: e.by || ""}; kind = "ot"; text = e.on ? `OPEN TENDER declared · ${e.by || ""}` : `Open Tender cancelled · ${e.by || ""}`; break;
      case "recovery": recovery = {on: !!e.on, since: e.on ? e.t : null}; kind = "pont"; text = e.on ? "Recovery started" : "Recovery ended"; break;
      case "cap": u.cap = e.cap; text = `Max load set to ${e.cap}`; break;
      case "driver": u.driver = e.driver; text = `Driver changed to ${e.driver}`; break;
      case "status": u.flag = e.status === "ok" ? null : {status:e.status, text:e.text || "", since:e.t}; kind = e.status === "emergency" ? "em" : "status";
        text = e.status === "ok" ? "Status cleared · back to normal" : `${STATUS[e.status] || e.status}${e.text ? " · " + e.text : ""}`; changes.push(e.t); break;
      case "note": u.note = e.text || ""; text = e.text ? `Note: ${e.text}` : "Note cleared"; break;
      case "sync": { const prev = ashore; ashore = +e.value; const d = ashore - prev; text = `Ashore synced to ${num(ashore)} (count was ${num(prev)}, Δ ${d >= 0 ? "+" : "−"}${num(Math.abs(d))})`; break; }

    log.push({e, unitName: u ? u.name : "—", unitId: u ? u.id : null, text, kind, pax, driver: (e.type === "depart" || e.type === "activate") ? (u ? u.driver : "") : (e.type === "driver" ? e.driver : "")});
  }

const inService = u => u.active;
const STATUS = {tech:"Technical issue", pvi:"PVI/PDI incident", emergency:"EMERGENCY"};

function estimate(day, st, now){
  const active = st.list.filter(inService);
  const caps = active.map(u => u.cap).filter(Boolean);
  const avgCap = caps.length ? caps.reduce((a,b) => a+b, 0) / caps.length : null;

  let cycle = st.cycleAvg, cycleSrc = "today";
  if (cycle == null){
    const prev = (S.data.days || []).find(d => d.id !== day.id && d.summary && d.summary.cycleAvg);
    if (prev){ cycle = prev.summary.cycleAvg; cycleSrc = "prev:" + prev.port; } else { cycle = 30; cycleSrc = "default"; }
  }
  let last = hmToMs(day.date, day.lastTender);
  if (last != null && day.openedAt && last < day.openedAt - 3600e3) last += 864e5;
  const remain = last != null ? (last - now) / 60000 : null;
  const inRecovery = !!(st.recovery && st.recovery.on);
  const A = Math.max(0, st.ashore);
  const r = {A, avgCap, cycle, cycleSrc, cycleN: st.cycleN || 0, last, remain, inRecovery, activeCount: active.length, trips:null, needed:null, recoverable:null, perUnit:null};
  if (!avgCap) return r;
  // Trips run at ~85% of max load on average (guests reach the pier a few at a time).
  r.load = Math.round(avgCap * LOAD_FACTOR);
  r.trips = Math.ceil(A / r.load);
  r.maxWait = DEFAULT_MAX_WAIT;
  if (A === 0){ r.needed = 0; r.reason = "none"; }
  else if (remain != null && remain > 0){
    r.perUnit = Math.max(1, Math.floor(remain / cycle));                 // full round trips still possible per tender
    r.capNeed = Math.ceil(r.trips / r.perUnit);                            // enough lift for everyone ashore
    r.waitNeed = Math.min(Math.ceil(cycle / r.maxWait), Math.max(2, r.trips)); // a tender at the pier every maxWait min, but never more tenders than there are loads to lift (min 2)
    r.peak = remain > 90 && A > 2 * r.load * (60 / cycle);                 // more ashore than 2 tenders can lift in an hour: the return peak is still to come
    r.final = remain < cycle;                                              // last round trip: hoisting a tender now saves nothing and leaves late arrivals waiting
    if (r.final) r.capNeed = A <= r.load ? 2 : r.trips + 1;                // final round: one trip each plus a sweep; one load or less ashore = 2 tenders
    const n = r.peak ? active.length : Math.max(r.capNeed, r.waitNeed);
    r.reason = r.peak ? "peak" : r.final ? "final" : r.capNeed >= r.waitNeed ? "lift" : "wait";
    r.needed = Math.min(active.length, n);
  } else { r.needed = Math.min(active.length, r.trips); r.reason = "late"; }
  r.recoverable = Math.max(0, active.length - r.needed);
  return r;
}

/* ---------------- capacity: demand vs lift, with a brake on hoisting ---------------- */
/* where each tender coming back will berth, and when it is due */
function legAvg(a){ return a && a.length ? a.slice(-8).reduce((x,y) => x+y, 0) / Math.min(8, a.length) : null; }
const etaRel = (eta, now) => eta > now ? "in " + fmtShort((eta - now) / 60000) : now - eta <= 3 * 60000 ? "due" : fmtShort((now - eta) / 60000) + " late";
function etaShip(st, u){
  if (!(u.loc === "transit" && u.dir === "ship")) return null;
  const own = u.tArrShore != null && u.tDepShip != null ? (u.tArrShore - u.tDepShip) / 60000 : null;   // this boat's own run out
  const run = legAvg(st.legs.tIn) ?? own ?? legAvg(st.legs.tOut) ?? 15;
  return u.since + run * 60000;
}
function berthPlan(st, now){
  const dwell = (legAvg(st.legs.ship) ?? 8) * 60000, plan = {};
  const slots = ["FWD","MID"].filter(b => st.pont[b]).map(b => ({b, free: st.occ[b] ? Math.max(now, (st.occ[b].since || now) + dwell) : now}));
  if (!slots.length) return plan;
  const queue = st.list.filter(u => u.active && u.loc === "ship" && u.berth === "SB").sort((a,b) => (a.since||0) - (b.since||0)).map(u => ({u, eta: now}))
    .concat(st.list.filter(u => u.active && u.loc === "transit" && u.dir === "ship").map(u => ({u, eta: etaShip(st, u) || now})).sort((a,b) => a.eta - b.eta));
  for (const q of queue){ slots.sort((a,b) => a.free - b.free); const s = slots[0]; const at = Math.max(s.free, q.eta); plan[q.u.id] = {b: s.b, at, wait: Math.max(0, (at - q.eta) / 60000)}; s.free = at + dwell; }
  return plan;
}
function capacity(day, st, now, est){
  const avg = a => a.length ? a.slice(-8).reduce((x,y) => x+y, 0) / Math.min(8, a.length) : null;
  const L = {tOut:avg(st.legs.tOut), pier:avg(st.legs.pier), tIn:avg(st.legs.tIn), ship:avg(st.legs.ship)};
  let cycle = (L.tOut && L.pier != null && L.tIn && L.ship != null) ? L.tOut + L.pier + L.tIn + L.ship : (st.cycleAvg || est.cycle || 30);
  const rec = st.trips.filter(x => x.pax > 0).slice(-10).map(x => x.pax / x.cap).sort((a,b) => a-b);
  const fill = rec.length >= 3 ? Math.min(1, Math.max(.5, rec[Math.floor(rec.length * .8)])) : .9;   // loads achieved when busy (80th percentile)
  const svc = st.list.filter(inService), n = svc.length;
  const lift = svc.reduce((a,u) => a + (u.cap || DEFAULT_CAP) * fill * 60 / cycle, 0);              // pax/h each way
  const win = (dir, from, to) => st.trips.filter(x => x.dir === dir && x.t > now - from*60000 && x.t <= now - to*60000);
  const sum = a => a.reduce((x,y) => x + y.pax, 0);
  const full = a => a.length >= 2 && a.filter(x => x.pax >= .9 * x.cap).length / a.length > .5;
  const o30 = win("shore",30,0), i30 = win("ship",30,0);
  const dOut = sum(o30) * 2 * (full(o30) ? 1.25 : 1), dIn = sum(i30) * 2 * (full(i30) ? 1.25 : 1);
  const d15 = Math.max(sum(win("shore",15,0)), sum(win("ship",15,0))) * 4, dPrev = Math.max(sum(win("shore",30,15)), sum(win("ship",30,15))) * 4;
  const demand = Math.max(dOut, dIn), sat = full(o30) || full(i30);
  const stowedOwn = st.list.filter(u => u.kind === "tender" && !u.active).length;
  const ownSvc = svc.filter(u => u.kind === "tender").length;
  const first = st.trips.length ? st.trips[0].t : null, lastChange = st.changes.length ? Math.max(...st.changes) : 0;
  const remain = est.remain;
  let sug = null;
  if (n && !est.inRecovery){
    if (stowedOwn && (demand >= .9 * lift || sat || (d15 > 1.3 * dPrev && d15 >= .7 * lift)) && !(remain != null && remain < 30))
      sug = {k:"up", t:"Demand rising · lower 1 tender"};
    else if (n > 2 && ownSvc > 1 && first && now - first >= 30*60000 && now - lastChange >= 30*60000 && !sat
      && demand <= .7 * lift * (n-1) / n && d15 <= .7 * lift * (n-1) / n && !(remain != null && remain < 120))
      sug = {k:"down", t:"Low demand for 30 min · 1 tender can be hoisted"};
  }
  return {L, cycle, fill, n, lift, dOut, dIn, demand, sat, sug, headway: n ? cycle / n : null};
}
function capHTML(cap, inStats){
  if (!cap.n) return "";
  const r = x => Math.round(x / 10) * 10, pct = Math.min(100, Math.round(cap.demand / Math.max(1, cap.lift) * 100));
  const parts = cap.L.tOut ? `${Math.round(cap.L.tOut)} + ${Math.round(cap.L.pier)} + ${Math.round(cap.L.tIn)} + ${Math.round(cap.L.ship)}` : "";
  return `<section class="capbar ${pct >= 90 ? "hi" : pct >= 70 ? "mid" : ""}">
    <div class="cb1"><span class="l">Demand</span><b>${r(cap.dOut)}</b><i>to shore</i><b>${r(cap.dIn)}</b><i>to ship</i><span class="u">pax/h</span></div>
    <div class="cb2"><span class="l">Lift</span><b>${r(cap.lift)}</b><span class="u">pax/h each way · ${cap.n} boats</span><span class="meter"><span style="width:${pct}%"></span></span></div>
    <div class="cb3"><span class="l">Round trip</span><b>${Math.round(cap.cycle)}′</b>${parts ? `<span class="u" title="run to shore + at pier + run to ship + at ship">${parts}</span>` : ""}</div>
    <div class="cb3"><span class="l">Loads</span><b>${Math.round(cap.fill * 100)}%</b></div>
    <div class="cb3"><span class="l">Boat at pier</span><b>every ${Math.round(cap.headway)}′</b></div>
    ${cap.sug && !inStats ? `<div class="sug ${cap.sug.k}">${cap.sug.k === "up" ? "▲" : "▼"} ${cap.sug.t}</div>` : ""}</section>`;
}
function recoverList(st, k){
  if (k <= 0) return [];
  const order = {ship:0, transit:1, shore:2};
  const own = st.list.filter(u => inService(u) && u.kind === "tender").sort((a,b) => (order[a.loc] - order[b.loc]) || ((a.loc === "transit" && a.dir === "ship") ? -1 : 1));
  const shore = st.list.filter(u => inService(u) && u.kind === "shore");
  const out = own.slice(0, Math.max(0, Math.min(k, own.length - 1)));              // keep at least one of our tenders for the shore party
  if (out.length < k) out.push(...shore.slice(0, k - out.length));               // shoretenders only if nothing else is left
  return out;
}

    <div class="m"><div class="l">Total</div><div class="v">${num(st.total)}</div><div class="q">reference</div></div></div>`;

  const prow = b => { const open = st.pont[b], o = st.occ[b];
    const state = !open ? `<em class="closed">Closed</em>` : o ? `<b>${nameHTML(o.name)}</b>` : `<em class="free">Free</em>`;
    return `<div class="prow ${!open ? "closed" : o ? "occ" : "free"}"><i></i><span class="pn">${berthName(b)}</span>${state}</div>`; };

      ${isAdmin() ? `<button class="btn small" data-act="pontoons">Change</button>` : ""}</div>
    ${prow("FWD")}${prow("MID")}
    ${sb.length ? `<div class="prow sb"><i></i><span class="pn">Stand-by</span><b>${sb.map(u => nameHTML(u.name)).join(", ")}</b></div>` : ""}</div>`;

  const cycleTxt = est.cycleSrc === "today" ? `average of the last ${est.cycleN} round trips today`
    : est.cycleSrc === "default" ? "default until today’s first round trips are logged" : `from the last tender day (${esc(est.cycleSrc.slice(5))}) until today’s are logged`;
  let rec;
  const ld = st.lastDep;
  const lastBox = ld ? (ld.arrived
      ? (st.ashore <= 0 ? `<p class="done">✓ Last tender back · tender count shows nobody ashore</p>`
         : `<p class="chk">Last tender back, but the tender count still shows <b>${num(st.ashore)}</b> ashore. Check with security${isAdmin() ? " or Sync Ashore" : ""}.</p>`)
      : `<p class="lastt">Last tender left shore <b class="mono">${fmtT(ld.t)}</b> · ${nameHTML(ld.name)} · ${ld.pax} pax</p>`) : "";
  if (!est.inRecovery){
    const remind = isAdmin() && est.remain != null && est.remain > 0 && est.remain <= RECOVERY_LEAD_H * 60;
    rec = `<div class="sec rec"><div class="sh"><span>Recovery</span><span class="phase out">Not started</span></div>
      <p class="big">Outbound · last tender <b class="mono">${esc(day.lastTender || "—")}</b>${est.remain != null && est.remain > 0 ? ` <span class="hint">in ${fmtDur(est.remain)}</span>` : ""}</p>
      ${remind ? `<p class="remind">Last tender in ${fmtDur(est.remain)}. Start recovery?</p>` : ""}
      ${isAdmin() ? `<button class="btn small ${remind ? "primary" : ""}" data-act="rec-start">Start recovery</button>` : `<p class="hint">The Bridge starts recovery when guests begin returning.</p>`}
      ${lastBox}</div>`;
  } else {
    let head, cls = "ok";
    if (ld) head = "";
    else if (!est.activeCount) head = "No tenders in service";
    else if (!est.avgCap) head = "Set max loads to estimate";
    else if (est.A === 0) head = `Nobody ashore · <b>${est.activeCount}</b> can be recovered`;
    else if (est.remain != null && est.remain <= 0){ cls = "crit"; head = `Past last tender · <b>${est.trips}</b> trip${est.trips === 1 ? "" : "s"} still needed`; }
    else if (est.peak){ cls = "warn"; head = `Keep all <b>${est.activeCount}</b> · return peak still to come`; }
    else { cls = est.needed >= est.activeCount ? "warn" : "ok"; head = `Keep <b>${est.needed}</b> of ${est.activeCount} in service · <b>${est.recoverable}</b> can be recovered`;
      const rl = recoverList(st, est.recoverable); if (rl.length) head += `<span class="rl">Recover first: ${rl.map(u => esc(u.full)).join(", ")} · shoretenders stay, one tender kept for the shore party</span>`; }
    rec = `<div class="sec rec ${cls}"><div class="sh"><span>Recovery</span><span class="phase on">Active since ${fmtT(st.recovery.since)}</span>
        ${ld ? "" : `<button class="btn small" data-act="rec" aria-expanded="${S.recOpen}">${S.recOpen ? "Hide" : "How"}</button>`}</div>
      ${head ? `<p class="big">${head}</p>` : ""}
      ${!ld && est.avgCap && est.A > 0 ? `<p class="hint">${num(est.A)} ashore → ${est.trips} full trip${est.trips === 1 ? "" : "s"} · ${est.remain > 0 ? `each tender can make ${est.perUnit} more before ${esc(day.lastTender)}` : "time is up"}</p>` : ""}
      ${lastBox}
      ${S.recOpen && !ld ? `<ol class="how">
        <li>People ashore: <b>${num(est.A)}</b></li>
        <li>Load per trip: <b>${est.load ?? "—"}</b> (85% of the average max load ${est.avgCap ? Math.round(est.avgCap) : "—"}: guests reach the pier a few at a time)</li>
        <li>Trips still needed: ${num(est.A)} ÷ ${est.load ?? "—"} → <b>${est.trips ?? "—"}</b></li>
        <li>Round trip: <b>${Math.round(est.cycle)} min</b>, ${cycleTxt}</li>
        <li>Time to last tender ${esc(day.lastTender || "")}: <b>${fmtDur(est.remain)}</b> → each tender can still make <b>${est.perUnit ?? "—"}</b> full round trips</li>
        <li>For the lift: ${est.final ? `${est.trips} trips + 1 sweep` : `${est.trips ?? "—"} trips ÷ ${est.perUnit ?? "—"} per tender`} → <b>${est.capNeed ?? "—"}</b> tenders</li>
        <li>For waiting time: a tender at the pier at least every ${est.maxWait} min (${Math.round(est.cycle)} ÷ ${est.maxWait}), never more than the loads left ashore (min 2) → <b>${est.waitNeed ?? "—"}</b> tenders</li>
        <li>${est.final ? `Final round (less than one round trip left): one trip per tender plus one sweep for late arrivals → keep the larger figure, <b>${est.needed}</b> of ${est.activeCount}` : est.peak ? `Return peak still to come: more people ashore than 2 tenders can lift in an hour, so keep all <b>${est.activeCount}</b>` : `Keep the larger of the two → <b>${est.needed ?? "—"}</b> of ${est.activeCount}`}</li></ol>
        <p class="hint">Advisory: the decision stays with the Bridge.</p>` : ""}
      ${isAdmin() ? `<button class="linkish" data-act="rec-stop">End recovery</button>` : ""}</div>`;
  }
  return `<section class="deck${isAdmin() ? "" : " nrec"}" aria-label="Tender status">${people}${pont}${isAdmin() ? rec : ""}</section>`;
}

/* ---------------- stores ---------------- */
function createLocalStore(){
  const KEY = "tom.demo.v7";
  let mem = null; const listeners = [];
  const read = () => { const s = lsGet(KEY); if (s){ try { return JSON.parse(s); } catch(e){} } return mem; };
  const db = () => read() || {days:{}, events:{}, issues:{}};
  const write = d => { mem = d; lsSet(KEY, JSON.stringify(d)); emit(); };
  function snap(){
    const d = db();
    const days = Object.values(d.days).sort((a,b) => (b.date || "").localeCompare(a.date || "") || (b.openedAt||0) - (a.openedAt||0));
    const currentDay = days.find(x => x.status === "open") || null;
    return {days, currentDay, events: currentDay ? (d.events[currentDay.id] || []) : [], issues: Object.values(d.issues).sort((a,b) => b.t - a.t), messages: Object.values(d.messages || {}).sort((a,b) => a.t - b.t), feedback: Object.values(d.feedback || {}), presence: Object.values(d.presence || {}), offline:false, pending:false};
  }
  function emit(){ const s = snap(); listeners.forEach(f => f(s)); }
  window.addEventListener("storage", e => { if (e.key === KEY) emit(); });
  const mut = fn => { const d = db(); fn(d); write(d); return Promise.resolve(); };
  return {
    mode:"demo",
    onChange(f){ listeners.push(f); f(snap()); },
    seedIfEmpty(){ if (!read()) write(makeSample()); },
    reset(){ write(makeSample()); },
    saveDay: day => mut(d => { d.days[day.id] = Object.assign({}, d.days[day.id], clean(day)); }),
    addEvent: (dayId, e) => mut(d => { (d.events[dayId] = d.events[dayId] || []).push(clean(e)); }),
    updateEvent: (dayId, id, p) => mut(d => { const a = d.events[dayId] || []; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = Object.assign({}, a[i], clean(p)); }),
    deleteEvent: (dayId, id) => mut(d => { d.events[dayId] = (d.events[dayId] || []).filter(x => x.id !== id); }),
    saveIssue: is => mut(d => { d.issues[is.id] = Object.assign({}, d.issues[is.id], clean(is)); }),
    deleteIssue: id => mut(d => { delete d.issues[id]; }),
    resetDay: dayId => mut(d => { d.events[dayId] = []; }),
    saveMessage: m => mut(d => { (d.messages = d.messages || {})[m.id] = clean(m); }),
    deleteMessages: ids => mut(d => { ids.forEach(id => { if (d.messages) delete d.messages[id]; }); }),
    getMessages: async dayId => Object.values(db().messages || {}).filter(m => m.dayId === dayId).sort((a,b) => a.t - b.t),
    savePresence: x => { const d = db(); d.presence = d.presence || {}; d.presence[x.id] = x; mem = d; lsSet(KEY, JSON.stringify(d)); },
    saveFeedback: f => mut(d => { d.feedback = d.feedback || {}; d.feedback[f.id] = Object.assign({}, d.feedback[f.id], clean(f)); }),
    deleteDay: dayId => mut(d => { delete d.events[dayId]; delete d.days[dayId]; }),
    getEvents: async dayId => (db().events[dayId] || []).slice()
  };
}

async function createFirebaseStore(){
  const V = "10.12.2";
  for (const m of ["app","auth","firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  firebase.initializeApp(CONFIG.firebase);
  const fs = firebase.firestore();
  try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){}
  const auth = firebase.auth();
  let days = [], events = [], issues = [], messages = [], feedback = [], presence = [], curId = null, unsubEv = null, unsubs = [], offline = !navigator.onLine, pending = false;
  const listeners = [];
  const emit = () => { const currentDay = days.find(d => d.status === "open") || null; const s = {days, currentDay, events: currentDay && currentDay.id === curId ? events : [], issues, messages, feedback, presence, offline, pending}; listeners.forEach(f => f(s)); };
  const fail = err => { console.error(err); toast(err.code === "permission-denied" ? "Access denied by the server" : "Sync error: " + (err.message || err)); };
  const dayRef = id => fs.collection("days").doc(id);
  function watchEvents(id){
    if (unsubEv) unsubEv(); unsubEv = null; events = []; curId = id;
    if (!id) return;
    unsubEv = dayRef(id).collection("events").onSnapshot({includeMetadataChanges:true}, s => {
      events = s.docs.map(d => d.data()); pending = s.metadata.hasPendingWrites; offline = s.metadata.fromCache && !navigator.onLine; emit();
    }, fail);
  }
  function start(){
    unsubs.push(fs.collection("days").orderBy("date","desc").limit(150).onSnapshot(s => {
      days = s.docs.map(d => d.data());
      const cur = days.find(d => d.status === "open"); const id = cur ? cur.id : null;
      if (id !== curId) watchEvents(id);
      emit();
    }, fail));
    unsubs.push(fs.collection("issues").orderBy("t","desc").limit(1000).onSnapshot(s => { issues = s.docs.map(d => d.data()); emit(); }, fail));
    unsubs.push(fs.collection("presence").onSnapshot(s => { presence = s.docs.map(d => d.data()); emit(); }, () => {}));
    unsubs.push(fs.collection("feedback").orderBy("t","desc").limit(300).onSnapshot(s => { feedback = s.docs.map(d => d.data()); emit(); }, fail));
    unsubs.push(fs.collection("messages").orderBy("t","desc").limit(300).onSnapshot(s => { messages = s.docs.map(d => d.data()).reverse(); emit(); }, fail));
  }
  function stop(){ unsubs.forEach(u => u()); unsubs = []; if (unsubEv) unsubEv(); unsubEv = null; curId = null; days = []; events = []; issues = []; messages = []; feedback = []; presence = []; }
  addEventListener("online", () => { offline = false; emit(); });
  addEventListener("offline", () => { offline = true; emit(); });
  const w = p => { p.catch(fail); return Promise.resolve(); };
  return {
    mode:"live",
    onAuth(cb){ auth.onAuthStateChanged(u => { stop(); if (u) start(); cb(u); }); },
    signIn: (role, pw) => auth.signInWithEmailAndPassword(CONFIG.accounts[role], pw),
    signOut: () => auth.signOut(),
    onChange(f){ listeners.push(f); },
    saveDay: d => w(dayRef(d.id).set(clean(d), {merge:true})),
    addEvent: (dayId, e) => w(dayRef(dayId).collection("events").doc(e.id).set(clean(e))),
    updateEvent: (dayId, id, p) => w(dayRef(dayId).collection("events").doc(id).update(clean(p))),
    deleteEvent: (dayId, id) => w(dayRef(dayId).collection("events").doc(id).delete()),
    saveIssue: is => w(fs.collection("issues").doc(is.id).set(clean(is), {merge:true})),
    deleteIssue: id => w(fs.collection("issues").doc(id).delete()),
    saveMessage: m => w(fs.collection("messages").doc(m.id).set(clean(m))),
    deleteMessages: async ids => { for (let i = 0; i < ids.length; i += 400){ const b = fs.batch(); ids.slice(i, i + 400).forEach(id => b.delete(fs.collection("messages").doc(id))); await b.commit().catch(fail); } },
    getMessages: async dayId => (await fs.collection("messages").where("dayId", "==", dayId).get()).docs.map(d => d.data()).sort((a,b) => a.t - b.t),
    savePresence: x => { fs.collection("presence").doc(x.id).set(clean(x)).catch(() => {}); },
    saveFeedback: f => w(fs.collection("feedback").doc(f.id).set(clean(f), {merge:true})),
    resetDay: async dayId => { const snap = await dayRef(dayId).collection("events").get(); const docs = snap.docs;
      for (let i = 0; i < docs.length; i += 400){ const b = fs.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit().catch(fail); } },
    deleteDay: async dayId => { const snap = await dayRef(dayId).collection("events").get(); const docs = snap.docs;
      for (let i = 0; i < docs.length; i += 400){ const b = fs.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit().catch(fail); }
      await dayRef(dayId).delete().catch(fail); },
    getEvents: async dayId => (await dayRef(dayId).collection("events").get()).docs.map(d => d.data())
  };
}

/* ---------------- sample data (demo mode only) ---------------- */
function makeSample(){
  let s = 23; const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a,b) => Math.round(a + rnd() * (b - a));
  const M = 60000, now = Date.now();
  const out = {days:{}, events:{}, issues:{}};
  const mk = (type, unit, t, extra) => Object.assign({id:"e" + uid() + ri(0,99999), c: t * 1000 + ri(0,999), type, unit, t}, extra || {});

  function buildDay(o){
    const ev = [], slots = [], span = o.lastTender - o.start;
    const occ = {FWD:null, MID:null}, waiting = [];
    const take = (id) => { for (const b of ["FWD","MID"]) if (!occ[b]){ occ[b] = id; return b; } return "SB"; };
    const free = (id) => { for (const b of ["FWD","MID"]) if (occ[b] === id) occ[b] = null; };
    for (const u of o.units){
      let t = o.start + u.off * M; u.start = t;
      t += ri(5,9) * M;
      while (t <= o.end && !(o.complete && t > o.lastTender + 5*M) && !(u.stopAt && t > u.stopAt)){
        slots.push({t, u, k:"depShip"}); t += ri(11,14) * M;
        slots.push({t, u, k:"arrShore"}); t += ri(4,8) * M;
        slots.push({t, u, k:"depShore"}); t += ri(11,14) * M;
        slots.push({t, u, k:"arrShip"}); t += ri(5,9) * M;
        u.endT = t;
      }
    }
    for (const u of o.units){
      const b = take(u.id);
      if (b === "SB") waiting.push(u.id);
      if (u.kind === "shore") ev.push(mk("shore_add", u.id, u.start, {name:u.name, cap:u.cap, driver:u.driver, berth:b}));
      else ev.push(mk("activate", u.id, u.start, {cap:u.cap, driver:u.driver, berth:b}));
    }
    slots.sort((a,b) => a.t - b.t);
    let ashore = 0, outSum = 0; const carry = {}; const cap0 = o.total * 0.68;
    for (const sl of slots){
      if (sl.t > o.end) break;
      const f = (sl.t - o.start) / span, u = sl.u, cap = u.cap;
      if (sl.k === "depShip"){
        let p = f < 0.22 ? ri(cap - 35, cap) : f < 0.45 ? ri(30, 90) : f < 0.7 ? ri(4, 30) : ri(0, 4);
        p = Math.max(0, Math.min(p, Math.round(cap0 - outSum))); outSum += p; carry[u.id] = p;
        const wi = waiting.indexOf(u.id); if (wi >= 0) waiting.splice(wi, 1);
        free(u.id);
        ev.push(mk("depart", u.id, sl.t, {dir:"shore", pax:p}));
        if (waiting.length){ const w = waiting.shift(); const b = take(w); ev.push(mk("berth", w, sl.t + 2*M, {berth:b})); }
      } else if (sl.k === "arrShore"){ ashore += carry[u.id] || 0; carry[u.id] = 0; ev.push(mk("arrive", u.id, sl.t, {at:"shore"})); }
      else if (sl.k === "depShore"){
        let p = f < 0.35 ? ri(0, 6) : f < 0.65 ? ri(25, 90) : f < 0.85 ? ri(90, cap) : cap;
        p = Math.max(0, Math.min(p, ashore)); ashore -= p; carry[u.id] = p;
        ev.push(mk("depart", u.id, sl.t, {dir:"ship", pax:p}));
      } else {
        const b = take(u.id); if (b === "SB") waiting.push(u.id);
        ev.push(mk("arrive", u.id, sl.t, {at:"ship", berth:b}));
      }
    }
    if (o.complete) for (const u of o.units){ free(u.id); ev.push(mk("deactivate", u.id, (u.endT || o.end) + ri(6,14) * M)); }
    return ev;
  }

  const pastBase = new Date(now - 3 * 864e5); pastBase.setHours(7, 20, 0, 0);
  const pStart = pastBase.getTime(), pLast = pStart + (10*60 + 40) * M;
  const pastId = "d" + uid();
  out.days[pastId] = {id:pastId, port:"Santorini", date:ymd(pStart), total:4312, lastTender:fmtT(pLast), plannedCycle:32, side:"PORT", fwd:true, mid:true, status:"closed", openedAt:pStart - 30*M, closedAt:pLast + 90*M};
  const pastEv = buildDay({total:4312, start:pStart, lastTender:pLast, end:pLast + 60*M, complete:true, units:[
    {id:"T11", cap:170, driver:"Jeffery", off:0}, {id:"T14", cap:170, driver:"Said", off:6}, {id:"T15", cap:170, driver:"John", off:12},
    {id:"T16", cap:170, driver:"Marco", off:18}, {id:"T17", cap:170, driver:"Tesorio", off:30}]});
  out.events[pastId] = pastEv;
  out.days[pastId].summary = summaryOf(compute(out.days[pastId], pastEv));

  const start = now - 5.5 * 3600e3, last = now + 2 * 3600e3 + 10*M;
  const id = "d" + uid(); const id_ = id;
  out.days[id] = {id, port:"Kotor", date:ymd(start), total:4280, lastTender:fmtT(last), plannedCycle:32, side:"STBD", fwd:true, mid:true, status:"open", openedAt:start - 20*M, allAboard:fmtT(last - 30*M), departure:fmtT(last), vhf:"72", uhf:"3"};
  const ev = buildDay({total:4280, start, lastTender:last, end:now, complete:false, units:[
    {id:"T11", cap:170, driver:"Jeffery", off:0}, {id:"T14", cap:170, driver:"Said", off:5},
    {id:"T15", cap:170, driver:"John", off:10}, {id:"T17", cap:170, driver:"Tesorio", off:16},
    {id:"S1", kind:"shore", name:"Kotor Star", cap:100, driver:"Local crew", off:45}]});
  ev.push(mk("driver", "T11", start + 190*M, {driver:"Musdar"}));
  ev.push(mk("note", "T15", now - 70*M, {text:"Refuel before the next run"}));
  // a realistic moment: MIDSHIP closed for swell, T11 alongside FWD, the shoretender waiting off the ship
  ev.push(mk("pontoons", null, now - 40*M, {side:"STBD", fwd:true, mid:false}));
  ev.push(mk("recovery", null, now - 25*M, {on:true}));
  ev.push(mk("opentender", null, now - 150*M, {on:true, by:"HOTEL"}));
  ev.push(mk("status", "T14", now - 20*M, {status:"tech", text:"Bilge alarm intermittent, returning after this run"}));
  out.messages = {};
  [[now - 140*M, "HOTEL", "Anna", "Shore Excursion Mgr", "Last excursion back at the pier 16:45, two coaches."],
   [now - 128*M, "DECK", "Marco", "2/O", "Copied. We keep 3 tenders running until then."],
   [now - 70*M, "TECH", "Paolo", "1st Engineer", "Tender 15 steering: will check at the next stop alongside."]].forEach(([t, dept, name, rank, text]) => { const id = "m" + uid() + Math.round(t); out.messages[id] = {id, t, dept, name, rank, text, dayId:id_, dev:"sample"}; });
  const lastOf = id => ev.filter(e => e.unit === id).sort((a,b) => a.t - b.t).pop();
  const l11 = lastOf("T11"); if (l11 && l11.type === "depart" && l11.dir === "ship") ev.push(mk("arrive", "T11", Math.max(l11.t + 8*M, now - 3*M), {at:"ship", berth:"FWD"}));
  const lS1 = lastOf("S1"); if (lS1 && lS1.type === "depart" && lS1.dir === "ship") ev.push(mk("arrive", "S1", Math.max(lS1.t + 8*M, now - 1*M), {at:"ship", berth:"SB"}));
  const syncT = now - 120*M;
  const before = compute(out.days[id], ev.filter(e => e.t < syncT));
  ev.push(mk("sync", null, syncT, {value: Math.max(0, before.ashore + 7)}));
  out.events[id] = ev;

  const iss = (unit, t, category, text, status, resolution) => { const x = {id:"i" + uid() + ri(0,999), unitName:unit, t, category, text, status, resolvedAt: status === "resolved" ? t + 95*M : null, resolution: resolution || "", port:""}; out.issues[x.id] = x; };
  iss("T15", now - 75*M, "Steering", "Slight play at the helm wheel, driver reports delayed response to starboard. Keep in service, monitor.", "open");
  iss("T14", pStart + 200*M, "Engine", "Port engine high coolant temp alarm on approach to the pier.", "resolved", "Sea water strainer cleared by tender mechanic, alarm reset, tested OK.");
  iss("T11", pStart + 320*M, "Release hooks / falls", "Hook release indicator lamp flickering after hoisting.", "resolved", "Loose connector at indicator panel, re-seated.");
  iss("T14", now - 30 * 864e5, "Engine", "Port engine high coolant temp alarm, same as before.", "resolved", "Strainer cleaned.");
  return out;
}

function summaryOf(st){
  return {tripsOut:st.tripsOut, tripsBack:st.tripsBack, paxOut:st.paxOut, paxBack:st.paxBack, firstLowered:st.firstLowered, lastHoisted:st.lastHoisted, cycleAvg: st.cycleAvg != null ? Math.round(st.cycleAvg) : null, ashoreEnd:st.ashore};
}

  return `<div class="emptystate">${boatSVG(false)}<h2>No tender operation open</h2>
    <p>${isAdmin() ? "Open a tender day to start logging lowering times, trips and passengers." : "The board fills in as soon as the Bridge opens today’s tender operation."}</p>
    ${isAdmin() ? `<button class="btn primary" data-act="open-day">Open tender day</button>` : ""}</div>`;
}

function boardHTML(){
  const day = S.data.currentDay;
  if (!day) return noDayHTML();
  const st = ST, now = Date.now(), est = estimate(day, st, now);
  const syncs = st.log.filter(l => l.e.type === "sync");
  const lastSync = syncs.length ? syncs[syncs.length - 1] : null;

  const statusPanel = statusHTML(day, st, est, lastSync);
  const lastInfo = est.remain != null ? (est.remain > 0 ? ` (in ${fmtDur(est.remain)})` : " (passed)") : "";
  const dayline = `<section class="dayline"><h1>${esc(day.port || "Tender day")}</h1>
    <span class="sub">${fmtDate(day.date)}</span>
    <span class="dinfo"><span>Last tender <b class="mono">${esc(day.lastTender || "—")}</b>${lastInfo}</span>${day.allAboard ? `<span>All aboard <b class="mono">${esc(day.allAboard)}</b></span>` : ""}${day.departure ? `<span>Departure <b class="mono">${esc(day.departure)}</b></span>` : ""}${day.vhf ? `<span class="chn">VHF&nbsp;<b>${esc(day.vhf)}</b></span>` : ""}${day.uhf ? `<span class="chn">UHF&nbsp;<b>${esc(day.uhf)}</b></span>` : ""}</span>
    ${st.log.length ? `<span class="sub">· Last entry <b class="mono">${fmtT(Math.max(...st.log.map(l => l.e.t)))}</b></span>` : ""}
    <span class="spacer"></span>${canOpenTender() && !st.openTender.on ? `<button class="btn small otbtn" data-act="ot-on">Open Tender…</button>` : ""}${isAdmin() ? `<button class="btn small" data-act="edit-day">Edit day</button><button class="btn small danger" data-act="close-day">Close day…</button>` : ""}</section>`;

  const tenders = st.list.filter(u => u.kind === "tender"), shores = st.list.filter(u => u.kind === "shore" && u.active);
  const head = `<div class="grow head"><div class="cb"><span class="hl">Boat</span><button class="icon-btn hbtn" data-act="legend" title="How to read the board" aria-label="How to read the board">?</button></div><div class="cs">${SHIP_ICON}Ship</div><div class="ct h-t">${SEA_ICON}In transit</div><div class="ch">${PIER_ICON}Shore</div><div class="ca"></div></div>`;
  const board = `<section class="board${isAdmin() ? "" : " ro"}" aria-label="Tender board">${head}${tenders.map(rowHTML).join("")}
    <div class="sep">Shoretenders ${isAdmin() ? `<button class="btn small" data-act="add-shore">+ Add shoretender</button>` : ""}</div>
    ${shores.length ? shores.map(rowHTML).join("") : `<div class="grow"><div class="cb"></div><div class="offc" style="grid-column:2 / -1;padding:12px;color:var(--muted);font-size:13.5px">No shoretenders today.</div></div>`}</section>`;
  const ot = st.openTender.on ? `<section class="otbar"><b>Open Tender</b><span>since <b class="mono">${fmtT(st.openTender.since)}</b> · ${esc(st.openTender.by)}</span>${canOpenTender() ? `<button class="btn small" data-act="ot-off">Cancel…</button>` : ""}</section>` : "";
  const cap = capacity(day, st, now, est);
  const ems = st.list.filter(u => u.flag && u.flag.status === "emergency");
  const em = ems.length ? `<section class="embar"><b>Emergency</b><span>${ems.map(u => `${esc(u.full)} since <b class="mono">${fmtT(u.flag.since)}</b>${u.flag.text ? " · " + esc(u.flag.text) : ""}`).join(" · ")}</span></section>` : "";
  const sumS = summaryOf(st);
  const statsOpen = (lsGet("tom.stats." + S.role) ?? (isAdmin() ? "1" : "0")) === "1";
  const stats = `<details class="stats" id="statsBox" ${statsOpen ? "open" : ""}><summary>Statistics</summary>${capHTML(cap, true)}<div class="sumgrid">${sumTiles(sumS)}</div></details>`;
  const sugBar = isAdmin() && cap.sug ? `<div class="sug ${cap.sug.k} sugbar">${cap.sug.k === "up" ? "▲" : "▼"} ${cap.sug.t}</div>` : "";
  return dayline + em + ot + statusPanel + sugBar + board + stats;
}

function rowHTML(u){
  const now = Date.now();
  const openIs = S.data.issues.filter(i => i.status === "open" && i.unitName === u.name).length;
  const cb = `<button class="cb" data-act="sheet" data-u="${u.id}" aria-label="${esc(u.full)} details">
      <span class="bn${u.kind === "shore" && u.name.length > 4 ? " long" : ""}"><span class="nm">${nameHTML(u.name)}</span></span>
      <span class="drv"><span class="dl">Driver </span><b>${esc(u.driver || "—")}</b></span>
      ${u.flag ? `<span class="flagl f-${u.flag.status}">${u.flag.status === "emergency" ? "■ EMERGENCY" : u.flag.status === "pvi" ? "■ PVI/PDI" : "■ Technical issue"}${u.flag.text ? `<em>${esc(u.flag.text)}</em>` : ""}</span>` : ""}
      ${openIs || u.note ? `<span class="marks">${openIs ? `<span class="iss">⚠ ${openIs} issue${openIs > 1 ? "s" : ""}</span>` : ""}${u.note ? `<span class="nt">✎ note</span>` : ""}</span>` : ""}</button>`;
  if (!u.active){
    return `<div class="grow off">${cb}<div class="offc">${boatSVG(false, "muted" + (u.kind === "shore" ? " shore" : ""), u.num)}<div><b>Not in service</b><div>${u.hoisted ? "Hoisted " + fmtT(u.hoisted) : u.kind === "tender" ? "Stowed" : "Released"}</div></div></div>
      <div class="ca">${isAdmin() ? `<button class="btn" data-act="activate" data-u="${u.id}">${u.kind === "tender" ? "Lower" : "Return"}</button>` : ""}</div></div>`;
  }
  const since = u.since ? `${fmtT(u.since)} · ${fmtShort((now - u.since) / 60000)}` : "";
  // bow faces the next move: at ship → shore (right), at shore → ship (left), stand-by waits facing the ship
  const flip = (u.loc === "transit" && u.dir === "ship") || u.loc === "shore" || (u.loc === "ship" && u.berth === "SB");
  const eta = ST ? etaShip(ST, u) : null;
  const canPlan = (u.loc === "transit" && u.dir === "ship") || (u.loc === "ship" && u.berth === "SB");
  const next = canPlan && u.plan ? `<span class="nextb">${u.loc === "transit" ? "" : "→ "}<b><span class="ln">${berthName(u.plan)}</span><span class="sn">${berthShort(u.plan)}</span></b></span>` : "";
  const etaTxt = eta ? `<span class="eta${now - eta > 3 * 60000 ? " late" : ""}">ETA<span class="lng"> ship</span> <b class="mono">${fmtT(eta)}</b><span class="lng"> · ${etaRel(eta, now)}</span></span>` : "";
  const tag = u.loc === "ship" ? (u.berth === "SB" ? `<span class="tag sb">Stand-by</span>` : `<span class="tag berth"><span class="ln">${berthName(u.berth)}</span><span class="sn">${berthShort(u.berth)}</span></span>`)
    : u.loc === "transit" ? `<span class="tag dir">${u.dir === "shore" ? "→ to shore" : "← to ship"}</span>` : "";
  const tok = `<div class="tok" role="button" tabindex="0" data-act="info" data-u="${u.id}" title="Details"><div class="vis">${ringSVG(u.pax, u.cap)}${boatSVG(flip, u.kind === "shore" ? "shore" : "", u.num)}</div>${tag}${next}<span class="xtra">${etaTxt}<span class="since mono">${since}</span></span></div>`;
  const cell = loc => u.loc === loc ? tok : "";
  let acts = "";
  if (isAdmin()){
    const B = (act, label, cls="", extra="") => `<button class="btn ${cls}" data-act="${act}" data-u="${u.id}" ${extra}>${label}</button>`;
    if (u.loc === "ship" && u.berth !== "SB") acts = B("depart-shore", "Depart → Shore", "primary");
    else if (u.loc === "ship"){
      const fb = freeBerths(ST);
      acts = fb.length ? fb.map(b => B("berth", `→ <span class="ln">${berthName(b)}</span><span class="sn">${berthShort(b)}</span>`, "sea", `data-b="${b}"`)).join("") : `<span class="wait">Waiting for a free pontoon</span>`;
    }
    else if (u.loc === "transit") acts = u.dir === "shore" ? B("arrive-shore", "Arrived Shore", "dark") : B("arrive-ship", "Arrived Ship", "dark") + B("plan", u.plan ? "Change pontoon" : "Assign pontoon", "small ghost");
    else if (u.loc === "shore") acts = B("depart-ship", "Depart → Ship", "primary");
  }
  return `<div class="grow${u.flag ? " fl-" + u.flag.status : ""}">${cb}<div class="cs">${cell("ship")}</div><div class="ct">${cell("transit")}</div><div class="ch">${cell("shore")}</div><div class="ca">${acts}</div></div>`;
}

function logRows(st, opts){
  const rows = st.log.filter(l => opts.unit === "all" || l.unitName === opts.unit).slice().reverse();
  if (!rows.length) return `<tr><td colspan="6" style="color:var(--muted)">Nothing logged yet.</td></tr>`;
  return rows.map(l => `<tr class="k-${l.kind}"><td class="t">${fmtT(l.e.t)}</td><td class="u">${esc(fullName(l.unitName))}</td><td>${esc(l.text)}</td>
    <td class="num">${l.pax != null ? l.pax : ""}</td><td>${esc(l.driver || "")}</td>
    ${opts.edit ? `<td class="ra"><button class="btn small" data-act="edit-ev" data-id="${l.e.id}">Edit</button></td>` : ""}</tr>`).join("");
}
function sumTiles(s){
  return `<div><span>Trips to shore</span><b>${s.tripsOut}</b></div><div><span>Pax to shore</span><b>${num(s.paxOut)}</b></div>
    <div><span>Trips to ship</span><b>${s.tripsBack}</b></div><div><span>Pax back</span><b>${num(s.paxBack)}</b></div>
    <div><span>First lowered</span><b class="mono">${fmtT(s.firstLowered)}</b></div><div><span>Last hoisted</span><b class="mono">${fmtT(s.lastHoisted)}</b></div>
    <div><span>Avg round trip</span><b>${s.cycleAvg != null ? s.cycleAvg + " min" : "—"}</b></div>`;
}
function logHTML(){
  const day = S.data.currentDay;
  if (!day) return noDayHTML();
  const st = ST;
  const names = st.list.filter(u => u.tripsOut || u.lowered || u.active || u.kind === "shore").map(u => u.name);
  return `<section class="panel"><div class="panel-head"><h2>${esc(day.port)} · Today’s log</h2><button class="icon-btn hbtn" data-act="help" data-k="log" aria-label="Help">?</button>
      <div class="filters"><select class="f" id="logUnit" data-act="log-unit" aria-label="Filter by unit"><option value="all">All units</option>${names.map(n => `<option value="${esc(n)}" ${S.logUnit === n ? "selected" : ""}>${esc(fullName(n))}</option>`).join("")}</select>
      ${isAdmin() ? `<button class="btn" data-act="undo-last">Undo last</button><button class="btn danger" data-act="reset-day">Reset board…</button>` : ""}<button class="btn" data-act="csv">Export CSV</button>${isAdmin() ? `<button class="btn danger" data-act="close-day">Close day…</button>` : ""}</div></div>
    <div class="sumgrid">${sumTiles(summaryOf(st))}</div>
    <div class="tablebox"><table><thead><tr><th>Time</th><th>Unit</th><th>Event</th><th style="text-align:right">Pax</th><th>Driver</th>${isAdmin() ? "<th></th>" : ""}</tr></thead>
    <tbody>${logRows(st, {unit:S.logUnit, edit:isAdmin()})}</tbody></table></div></section>`;
}
function issueUnits(){
  const set = new Set(TENDERS.map(t => t.id));
  if (ST) ST.list.filter(u => u.kind === "shore").forEach(u => set.add(u.name));
  S.data.issues.forEach(i => set.add(i.unitName));
  return [...set];
}
function issuesHTML(){
  const all = S.data.issues;
  const list = all.filter(i => (S.issueUnit === "all" || i.unitName === S.issueUnit) && (S.issueStatus === "all" || i.status === S.issueStatus));
  const units = issueUnits();
  return `<section class="panel"><div class="panel-head"><h2>Tender issues · maintenance log</h2><button class="icon-btn hbtn" data-act="help" data-k="issues" aria-label="Help">?</button>
      <div class="filters">
        <select class="f" id="issueUnit" data-act="issue-unit" aria-label="Filter by unit"><option value="all">All units</option>${units.map(n => `<option value="${esc(n)}" ${S.issueUnit === n ? "selected" : ""}>${esc(fullName(n))}</option>`).join("")}</select>
        <select class="f" id="issueStatus" data-act="issue-status" aria-label="Filter by status">${[["all","Open + resolved"],["open","Open"],["resolved","Resolved"]].map(([v,l]) => `<option value="${v}" ${S.issueStatus === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${canIssues() ? `<button class="btn primary" data-act="new-issue">Report issue</button>` : ""}</div></div>
    <div class="issues">${list.length ? list.map(i => {
      const repeat = all.filter(x => x.unitName === i.unitName && x.category === i.category && x.id !== i.id && x.t < i.t).length;
      return `<div class="issue"><div class="who2">${nameHTML(i.unitName)}</div>
      <div class="body"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cat">${esc(i.category)}</span><span class="status ${i.status}">${i.status}</span>${repeat ? `<span class="pill warn">Seen ${repeat}× before on ${esc(fullName(i.unitName))}</span>` : ""}</div>
        <p>${esc(i.text)}</p><span class="when mono">${new Date(i.t).toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"})} · ${fmtT(i.t)}${i.port ? " · " + esc(i.port) : ""}</span>
        ${i.status === "resolved" && (i.resolution || i.resolvedAt) ? `<div class="res">${i.resolvedAt ? `<span class="mono">${fmtT(i.resolvedAt)}</span> ` : ""}${esc(i.resolution || "Resolved")}</div>` : ""}</div>
      ${canIssues() ? `<div class="side-acts">${i.status === "open" ? `<button class="btn small" data-act="resolve" data-id="${i.id}">Resolve</button>` : `<button class="btn small" data-act="reopen" data-id="${i.id}">Reopen</button>`}<button class="btn small" data-act="edit-issue" data-id="${i.id}">Edit</button></div>` : ""}</div>`;
    }).join("") : `<div class="emptystate" style="padding:24px"><p>No issues match this filter.</p></div>`}</div></section>`;
}
function historyHTML(){
  if (S.hist){
    const d = S.data.days.find(x => x.id === S.hist);
    if (!d){ S.hist = null; return historyHTML(); }
    if (!S.histEvents) return `<section class="panel"><p>Loading…</p></section>`;
    const st = compute(d, S.histEvents);
    return `<section class="panel"><div class="panel-head"><button class="btn" data-act="hist-back">← All days</button><h2>${esc(d.port)} · ${fmtDate(d.date)}</h2>

      <div class="sumgrid">${sumTiles(summaryOf(st))}<div><span>Total (ref)</span><b>${num(d.total)}</b></div></div>
      <div class="tablebox"><table><thead><tr><th>Time</th><th>Unit</th><th>Event</th><th style="text-align:right">Pax</th><th>Driver</th></tr></thead><tbody>${logRows(st, {unit:"all", edit:false})}</tbody></table></div>
      <h3 class="bh">Chat</h3>${S.histMsgs && S.histMsgs.length ? `<div class="mlist hist">${msgsHTML(S.histMsgs)}</div>` : `<p class="hint" style="margin:0">No chat messages on this day.</p>`}</section>`;
  }
  const days = S.data.days;
